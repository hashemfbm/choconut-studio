  async function renderCanvas(model,page,compact = false,plans = null) {
    await document.fonts.ready;
    exportLogo ??= loadImage(LOGO_IMAGE);
    const logo = await exportLogo;
    const canvas = document.createElement('canvas');
    const banner = Boolean(model.banner);
    canvas.width = SHEET_WIDTH;
    canvas.height = model.label ? LABEL_HEIGHT : banner ? bannerHeight(model) : compact ? plans[page].bottom+164 : SHEET_HEIGHT;
    const ctx = canvas.getContext('2d',{alpha:false});
    if (!ctx) throw new Error('Canvas unavailable');
    if (model.label) {
      paintServingLabel(ctx,model,logo);
    } else if (banner) {
      const source = photoUrl(model.product.photo);
      const photo = source ? await loadImage(source).catch(() => null) : null;
      paintBanner(ctx,model,page,photo,logo);
    } else {
      paintSheet(ctx,model,page,plans,logo);
    }
    return canvas;
  }

  function encodeCanvas(canvas, type) {
    return new Promise((resolve,reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('Image encoding failed'));
      },type,.94);
    });
  }

  function imagePdf(images,pageWidth,pageHeight) {
    const encoder = new TextEncoder();
    const parts = [];
    const offsets = [0];
    let bytes = 0;
    function append(chunk) {
      const block = typeof chunk === 'string' ? encoder.encode(chunk) : chunk;
      parts.push(block);
      bytes += block.byteLength;
    }
    function object(id,...chunks) {
      offsets[id] = bytes;
      append(`${id} 0 obj\n`);
      chunks.forEach(append);
      append('\nendobj\n');
    }
    append('%PDF-1.4\n');
    append(new Uint8Array([0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
    object(1,'<< /Type /Catalog /Pages 2 0 R >>');
    const kids = images.map((_,index) => `${3 + index * 3} 0 R`).join(' ');
    object(2,`<< /Type /Pages /Count ${images.length} /Kids [${kids}] >>`);
    images.forEach(({jpeg,width,height},index) => {
      const id = 3 + index * 3;
      const stream = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Artwork Do\nQ\n`;
      object(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Artwork ${id+1} 0 R >> >> /Contents ${id+2} 0 R >>`);
      object(id+1,`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`,jpeg,'\nendstream');
      object(id+2,`<< /Length ${stream.length} >>\nstream\n`,stream,'endstream');
    });
    const xref = bytes;
    append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);
    offsets.slice(1).forEach(offset => append(`${String(offset).padStart(10,'0')} 00000 n \n`));
    append(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts,{type:'application/pdf'});
  }

  function exportBaseName(model) {
    const label = [model.product.number,model.product.name].filter(Boolean).join(' - ');
    const name = label.replace(/[<>:"/\\|?*\x00-\x1f\u202a-\u202e\u2066-\u2069]/g,' ').trim().slice(0,95);
    return name ? `${model.title} - ${name}` : model.title;
  }

  async function makeFiles(model,formatType) {
    const artwork = Boolean(model.banner || model.label);
    const plans = artwork ? null : sheetPages(model.sections);
    const pages = model.banner ? bannerPages(model) : plans?.length ?? 1;
    const base = exportBaseName(model);
    const files = [];
    const images = [];
    for (let page=0; page<pages; page+=1) {
      const canvas = await renderCanvas(model,page,formatType === 'png',plans);
      try {
        if (formatType === 'png') {
          const blob = await encodeCanvas(canvas,'image/png');
          files.push(new File([blob],`${base}${pages > 1 ? ' - ' + (page+1) : ''}.png`,{type:'image/png'}));
        } else {
          const jpeg = await encodeCanvas(canvas,'image/jpeg');
          images.push({width:canvas.width,height:canvas.height,jpeg:new Uint8Array(await jpeg.arrayBuffer())});
        }
      } finally {
        canvas.width = 0;
        canvas.height = 0;
      }
    }
    if (formatType === 'pdf') {
      const pdf = imagePdf(images,artwork ? 540 : 595.28,artwork ? images[0].height/2 : 841.89);
      files.push(new File([pdf],`${base}.pdf`,{type:'application/pdf'}));
    }
    return files;
  }

  function getReportFiles(model,formatType) {
    const key = `${state.revision}/${model.key ?? reportId(model.product) + '/' + model.kind}`;
    if (reportFiles?.key !== key) reportFiles = {key};
    const group = reportFiles;
    if (!group[formatType]) {
      group[formatType] = makeFiles(model,formatType).catch(error => {
        delete group[formatType];
        throw error;
      });
    }
    return group[formatType];
  }

    const url = URL.createObjectURL(file);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = file.name;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  }

  async function prepareShare(model,formatType) {
    const pending = {model,files:null,canShare:false};
    shareState = pending;
    const status = document.querySelector('#share-status');
    const send = document.querySelector('#share-file');
    const download = document.querySelector('#share-download');
    const email = document.querySelector('#email-report');
    status.textContent = 'در حال آماده‌سازی فایل…';
    send.disabled = true;
    send.hidden = false;
    download.disabled = true;
    email.hidden = true;
    try {
      const files = await getReportFiles(model,formatType);
      if (shareState !== pending || !status.isConnected || !modal.open) return;
      pending.files = files;
      pending.canShare = typeof navigator.share === 'function' && typeof navigator.canShare === 'function' && navigator.canShare({files});
      send.disabled = !pending.canShare;
      send.hidden = !pending.canShare;
      email.hidden = pending.canShare;
      download.disabled = false;
      status.textContent = pending.canShare ? 'فایل آماده ارسال است.' : 'فایل را دانلود کنید و به پیام یا ایمیل پیوست کنید.';
    } catch {
      if (shareState === pending && status.isConnected) status.textContent = 'آماده‌سازی فایل انجام نشد. فرمت را دوباره انتخاب کنید.';
    }
  }

  async function sendSharedFile() {
    if (!shareState?.canShare) return;
    try {
      const {model,files} = shareState;
      await navigator.share({title:[model.title,model.product.name].filter(Boolean).join(' - '),files});
      modal.close();
    } catch (error) {
      if (error.name !== 'AbortError') toast('ارسال در این مرورگر انجام نشد. می‌توانید فایل را دانلود کنید.',true);
    }
  }

  function downloadBackup() {
    if (recoveryOnly) return;
    try {
      const {ingredients,products,batches} = state;
      const createdAt = new Date().toISOString();
      const json = JSON.stringify({type:BACKUP_TYPE,version:BACKUP_VERSION,createdAt,data:{ingredients,products,batches}});
      const filename = `choconut-backup-${createdAt.slice(0,19).replace(/[T:]/g,'-')}.json`;
      const file = new File([json],filename,{type:'application/json'});
      if (file.size > MAX_BACKUP_BYTES) {
        toast('حجم پشتیبان از سقف ۱۲۸ مگابایت بیشتر است.',true);
        return;
      }
      downloadFile(file);
      toast('فایل پشتیبان آمادهٔ دانلود شد.');
    } catch {
      toast('ساخت فایل پشتیبان انجام نشد.',true);
    }
  }

  function parseBackup(json) {
    const backup = dataObject(JSON.parse(json));
    checkData(backup.type === BACKUP_TYPE && [1,2,BACKUP_VERSION].includes(backup.version));
    if (backup.version >= 2) checkData(Array.isArray(backup.data?.batches));
    return workspaceData(backup.data,true);
  }

  async function inspectBackup(file) {
    const status = modal.querySelector('#backup-status');
    const choose = modal.querySelector('[data-action="backup-pick"]');
    if (!file || !status || !choose) return;
    if (file.size === 0 || file.size > MAX_BACKUP_BYTES) {
      status.textContent = 'یک فایل پشتیبان JSON تا سقف ۱۲۸ مگابایت انتخاب کنید.';
      return;
    }
    choose.disabled = true;
    status.textContent = 'در حال بررسی فایل پشتیبان…';
    try {
      const replacement = parseBackup(await file.text());
      if (!modal.open || !status.isConnected) return;
      pendingBackup = replacement;
      showDialog('تأیید بازیابی',`<div class="dialog-body">
        <p>بازیابی، داده‌های فعلی این مرورگر را با محتوای فایل انتخاب‌شده جایگزین می‌کند.</p>
        ${draft?.dirty ? '<p class="notice">تغییرات ذخیره‌نشدهٔ فرم هم کنار گذاشته می‌شوند.</p>' : ''}
        <div class="confirm-summary">
          <div class="report-fact"><span>محصولات</span><strong>${format(replacement.products.length + replacement.batches.length)}</strong></div>
          <div class="report-fact"><span>مواد اولیه</span><strong>${format(replacement.ingredients.length)}</strong></div>
          <div class="report-fact"><span>نوبت‌های تولید</span><strong>${format(replacement.batches.length)}</strong></div>
        </div>
        ${recoveryOnly ? '' : button('backup-download','دانلود پشتیبان فعلی','backup','text')}
      </div><footer class="dialog-actions">${button('backup','بازگشت',null)}${button('backup-restore','بازیابی و جایگزینی','check','danger')}</footer>`,true);
      modal.querySelector('[data-action="backup"]').focus();
    } catch {
      if (status.isConnected) status.textContent = 'این فایل پشتیبان معتبر چوکو‌نات نیست یا نسخهٔ آن پشتیبانی نمی‌شود.';
    } finally {
      if (choose.isConnected) choose.disabled = false;
    }
  }

  async function restoreBackup(control) {
    if (!pendingBackup || saveInProgress) return;
    const replacement = pendingBackup;
    control.disabled = true;
    try {
      if (await commit(replacement,{restore:true})) {
        draft = null;
        reportKind = 'cost';
        pendingBackup = null;
        renderStorageLabel();
        modal.close();
        go('dashboard');
        toast('پشتیبان بازیابی شد.');
      }
    } finally {
      control.disabled = false;
    }
  }

  function brandMarkup() {
    return `<img class="wordmark" src="${LOGO_IMAGE}" alt="Choconut. ${SLOGAN}" width="1440" height="384">`;
  }

  function renderShell() {
    const active = route.view === 'editor' ? 'products' : route.view === 'batch' ? 'batches' : route.view;
    const html = NAV.map(([key,label,glyph]) => `<a class="nav-link" href="#${key}" ${active === key ? 'aria-current="page"' : ''}>${icon(glyph)}<span>${label}</span></a>`).join('');
    document.querySelector('#desktop-nav').innerHTML = html;
    document.querySelector('#mobile-nav').innerHTML = html;
    const label = route.view === 'editor' ? 'ویرایش محصول'
      : route.view === 'batch' ? (draft?.id ? 'ویرایش نوبت تولید' : 'ثبت تولید جدید') : NAV.find(([key]) => key === active)[1];
    document.querySelector('#breadcrumb').innerHTML = `${icon('home')}<span>فضای کاری</span><span class="divider" aria-hidden="true">/</span><strong>${label}</strong>`;
    document.title = `${label} | ${BRAND}`;
  }

  function parseRoute() {
    const [path,id = ''] = location.hash.slice(1).split('/');
    const view = path === 'reports' ? 'products' : path;
    if (view === 'editor' && (!id || id === 'new')) return {view:'batch',id:'new'};
    if (![...NAV.map(([key]) => key),'editor','batch'].includes(view)) return {view:'dashboard',id:''};
    try { return {view,id:decodeURIComponent(id)}; }
    catch { return {view,id:''}; }
  }

  function go(view,id = '',replace = false) {
    const hash = navLink(view,id);
    if (location.hash === hash) transition(false);
    else if (replace) {
      history.replaceState(null,'',hash);
      transition();
    }
    else location.hash = hash;
  }

  function transition(focus = true) {
    if (!state) return;
    const next = parseRoute();
    const changed = route.view !== next.view || route.id !== next.id;
    if (draft?.dirty && changed && !window.confirm('تغییرات فرم ذخیره نشده‌اند. از این صفحه خارج می‌شوید؟')) {
      history.replaceState(null,'',navLink(route.view,route.id));
      return;
    }

    if (changed && modal.open) modal.close();
    const isBatch = next.view === 'batch';
    const editing = isBatch || next.view === 'editor';
    if (editing && (changed || !draft)) {
      const record = (isBatch ? state.batches : state.products).find(product => product.id === next.id);
      if (next.id && next.id !== 'new' && !record) {
        toast(isBatch ? 'نوبت تولید پیدا نشد.' : 'محصول مورد نظر پیدا نشد.',true);
        go(isBatch ? 'batches' : 'products');
        return;
      }
      draft = createDraft(record,isBatch);
    } else if (!editing) {
      draft = null;
    }
    if (changed && next.view === 'products' && next.id) reportKind = 'cost';
    if (changed) bannerPage = 0;
    if (next.view !== route.view) searchText = '';
    route = next;
    renderShell();
    if (route.view === 'dashboard') renderDashboard();
    if (route.view === 'products' && route.id) renderReport();
    else if (['products','ingredients','prices','batches'].includes(route.view)) renderCollection();
    if (editing) renderEditor();
    if (focus && changed) {
      window.scrollTo(0,0);
      main.focus({preventScroll:true});
    }
  }

  let removal;

  function confirmRemoval(kind,id) {
    const item = kind === 'product' ? state.products.find(row => row.id === id) : state.ingredients.find(row => row.id === id);
    if (!item && kind !== 'samples') return;
    const message = item
      ? `«${escapeHtml(item.name)}» از فهرست ${kind === 'product' ? 'محصولات' : 'مواد اولیه'} حذف شود؟`
      : 'محصولات و موادی که با عنوان «نمونه» مشخص شده‌اند، حذف شوند؟';
    removal = {kind,id};
    showDialog('تأیید حذف',`<div class="dialog-body"><p>${message}</p></div><footer class="dialog-actions">
      ${button('close-dialog','انصراف',null)}${button('confirm-remove','حذف','trash','danger')}</footer>`,true);
    modal.querySelector('[data-action="close-dialog"]').focus();
  }

  async function removeRecord() {
    if (!removal) return;
    const {kind,id} = removal;
    const changes = {};
    if (kind === 'product' || kind === 'samples') changes.products = state.products.filter(product => kind === 'samples' ? !product.sample : product.id !== id);
    if (kind === 'ingredient' || kind === 'samples') changes.ingredients = state.ingredients.filter(food => kind === 'samples' ? !food.sample : food.id !== id);
    if (await commit(changes)) {
      modal.close();
      if (route.view === 'products' && route.id) go('products','',true);
      else if (route.view === 'products' || route.view === 'ingredients') renderCollection();
      toast('حذف انجام شد.');
    }
  }

  function updateInstallButton() {
    const control = document.querySelector('#install-button');
    control.hidden = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    control.setAttribute('aria-label',installPrompt ? 'نصب برنامه' : 'راهنمای نصب');
    control.innerHTML = `${icon('phone')} <span class="topbar-label">نصب</span>`;
  }

  async function installApp() {
    if (installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      try { await prompt.prompt(); }
      catch { toast('گزینه نصب را از منوی مرورگر انتخاب کنید.',true); }
      updateInstallButton();
      return;
    }
    showDialog('نصب چوکو‌نات روی گوشی',`<div class="dialog-body">
      ${location.protocol === 'file:' ? '<p class="notice" style="margin-top:0">برای نصب، نسخهٔ آنلاین چوکو‌نات را با آدرس HTTPS باز کنید.</p>' : ''}
      <p><strong>اندروید</strong><br>در Chrome، از منوی سه‌نقطه گزینهٔ «نصب برنامه» یا «افزودن به صفحه اصلی» را انتخاب کنید.</p>
      <p><strong>آیفون</strong><br>در Safari، دکمهٔ اشتراک‌گذاری را بزنید و «Add to Home Screen» را انتخاب کنید.</p>
      <p><strong>کامپیوتر</strong><br>در Chrome یا Edge، گزینهٔ نصب را در نوار آدرس یا منوی مرورگر انتخاب کنید.</p>
      </div><footer class="dialog-actions">${button('close-dialog','بستن',null,'primary')}</footer>`,true);
  }

  function addDraftRow(custom) {
    const row = makeDraftRow(custom ? 'custom' : '');
    draft.rows.push(row);
    draft.dirty = true;
    renderIngredientRows(row.key,custom ? 'name' : 'source');
  }

  const actions = {
    'backup':openBackup,
    'backup-download':downloadBackup,
    'backup-pick':() => modal.querySelector('#backup-file').click(),
    'backup-restore':restoreBackup,
    'new-ingredient':() => openIngredient(),
    'edit-ingredient':(_,id) => openIngredient(id),
    'edit-price':(_,id) => openPrice(id),
    'price-for-row':(_,id) => {
      const row = draft?.rows.find(item => item.key === id);
      if (row) openPrice(row.source,row.key);
    },
    'delete-ingredient':(_,id) => confirmRemoval('ingredient',id),
    'delete-product':(_,id) => confirmRemoval('product',id),
    'clear-samples':() => confirmRemoval('samples'),
    'confirm-remove':removeRecord,
    'close-dialog':() => modal.close(),
    'add-row':() => addDraftRow(false),
    'add-custom-row':() => addDraftRow(true),
    'open-batch-copy':openBatchCopy,
    'open-calendar':openCalendar,
    'calendar-step':(control,direction) => {
      const next = shiftPersianMonth(calendar.year,calendar.month,direction === 'previous' ? -1 : 1);
      showCalendarMonth(next.year,next.month,control.id);
    },
    'calendar-day':(_,date) => selectCalendarDay(date),
    'calendar-today':() => selectCalendarDay(todayTehran()),
    'remove-row':(_,id) => {
      draft.rows = draft.rows.filter(row => row.key !== id);
      draft.dirty = true;
      renderIngredientRows();
    },
    'row-nutrition':(_,id) => openRowNutrition(id),
    'refresh-row':(_,id) => {
      const row = draft.rows.find(row => row.key === id);
      if (!row) return;
      setDraftSource(row,row.source);
      renderIngredientRows(row.key,'price');
    },
    'pick-photo':() => document.querySelector('#photo-file').click(),
    'remove-photo':() => {
      draft.photo = null;
      draft.dirty = true;
      renderPhotoSlot();
    },
    'report-tab':(_,id) => {
      if (!Object.hasOwn(REPORT_NAMES,id)) return;
      reportKind = id;
      bannerPage = 0;
      renderReport();
      main.querySelector(`[data-action="report-tab"][data-id="${id}"]`)?.focus({preventScroll:true});
    },
    'download-png':control => downloadReport('png',control),
    'download-pdf':control => downloadReport('pdf',control),
    'share-report':() => openShare(),
    'list-png':control => downloadReport('png',control,batchRegisterModel()),
    'list-pdf':control => downloadReport('pdf',control,batchRegisterModel()),
    'list-share':() => openShare(batchRegisterModel()),
    'share-file':sendSharedFile,
    'share-download':() => { if (shareState?.files) downloadFiles(shareState.files); },
    'download-page':(_,id) => {
      const file = downloadPages[Number(id)];
      if (file) downloadFile(file);
    },
    'install':installApp,
  };

  document.addEventListener('click',event => {
    const skip = event.target.closest('.skip-link');
    if (skip) {
      event.preventDefault();
      main.focus();
      return;
    }
    const productLink = event.target.closest('[data-product-link],[data-products-back]');
    if (productLink && event.button === 0 && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
      if (productLink.hasAttribute('data-products-back') && history.state?.fromProductList) {
        event.preventDefault();
        history.back();
        return;
      }
      if (productLink.hasAttribute('data-product-link') && route.view === 'products' && !route.id) {
        event.preventDefault();
        history.pushState({fromProductList:true},'',productLink.hash);
        transition();
        return;
      }
    }
    const control = event.target.closest('[data-action]');
    if (!control || control.disabled || !state) return;
    const action = control.dataset.action;
    if (Object.hasOwn(actions,action)) actions[action](control,control.dataset.id);
  });

  document.addEventListener('input',event => {
    const input = event.target;
    if (input.hasAttribute('data-numeric') && !event.isComposing) formatNumericInput(input,event.inputType);
    clearFieldError(input);
    if (input.form) formMessage(input.form);
    if (input.name === 'search') {
      searchText = input.value;
      updateList();
    }
    if (input.form?.id === 'price-form') updatePricePreview(input.form);
    if (input.form?.id !== 'product-form' || !draft) return;
    const rowField = {rowName:'name',rowGrams:'grams',rowPrice:'price'}[input.name];
    if (rowField) {
      const row = draft.rows.find(item => item.key === input.dataset.row);
      if (row) row[rowField] = input.value;
    } else if (['name','description','serving','extraCost','quantity'].includes(input.name)) {
      draft[input.name] = input.value;
    } else {
      return;
    }
    draft.dirty = true;
    updateDraftSummary();
  });

  document.addEventListener('change',event => {
    const input = event.target;
    if (input.name === 'rowSource') {
      const row = draft.rows.find(item => item.key === input.dataset.row);
      if (row) {
        setDraftSource(row,input.value);
        renderIngredientRows(row.key,input.value === 'custom' ? 'name' : 'grams');
      }
    }
    if (input.id === 'photo-file') {
      const file = input.files[0];
      input.value = '';
      if (file) attachPhoto(file);
    }
    if (input.id === 'backup-file') {
      const file = input.files[0];
      input.value = '';
      if (file) inspectBackup(file);
    }
    if (input.id === 'calendar-month') showCalendarMonth(calendar.year,Number(input.value),input.id);
    if (input.id === 'calendar-year') {
      const year = Number(input.value);
      const min = persianDate(utcDay(FIRST_DATE));
      const max = persianDate(utcDay(LAST_DATE));
      const month = Math.max(year === min.year ? min.month : 1,Math.min(year === max.year ? max.month : 12,calendar.month));
      showCalendarMonth(year,month,input.id);
    }
    if (input.name === 'batchSort' && ['date','number','cost','unit'].includes(input.value)) {
      batchSort = input.value;
      updateList();
    }
    if (input.id === 'price-unit') updatePricePreview(input.form);
    if (input.id === 'banner-page') {
      bannerPage = Number(input.value);
      renderBannerPreview(activeReport());
    }
    if (input.name === 'shareFormat' && shareState) prepareShare(shareState.model,input.value);
  });

  const formActions = {
    'product-form':saveProduct,'ingredient-form':saveIngredient,'price-form':savePrice,
    'row-nutrition-form':saveRowNutrition,'banner-weight-form':saveBannerWeight,'batch-copy-form':copyBatch,
  };
  document.addEventListener('submit',async event => {
    const form = event.target;
    if (!Object.hasOwn(formActions,form.id)) return;
    const handler = formActions[form.id];
    event.preventDefault();
    if (saveInProgress) return;
    formMessage(form);
    form.querySelectorAll('[aria-invalid=true]').forEach(clearFieldError);
    try { await handler(form); }
    catch (error) {
      if (error instanceof FormIssue) {
        if (!error.field) {
          formMessage(form,error.message);
          form.querySelector('.form-error')?.scrollIntoView({block:'nearest'});
        }
      } else {
        toast('در پردازش فرم مشکلی پیش آمد. دوباره تلاش کنید.',true);
      }
    }
  });

  main.addEventListener('dragover',event => {
    if (event.target.closest('#photo-slot')) event.preventDefault();
  });
  main.addEventListener('drop',event => {
    if (!event.target.closest('#photo-slot')) return;
    event.preventDefault();
    if (event.dataTransfer.files.length) attachPhoto(event.dataTransfer.files[0]);
  });
  modal.addEventListener('close',() => {
    calendar = null;
    shareState = null;
    downloadPages = [];
    removal = null;
    pendingBackup = null;
  });
  window.addEventListener('hashchange',() => transition());
  window.addEventListener('beforeunload',event => {
    if (draft?.dirty) {
      event.preventDefault();
      event.returnValue = true;
    }
  });
  window.addEventListener('beforeinstallprompt',event => {
    event.preventDefault();
    installPrompt = event;
    updateInstallButton();
  });
  window.addEventListener('appinstalled',() => {
    installPrompt = null;
    document.querySelector('#install-button').hidden = true;
  });

  function renderStorageLabel(label = 'ذخیره روی این دستگاه') {
    document.querySelector('#storage-label').innerHTML = `${icon('disk')} ${label}`;
  }

  async function init() {
    const wordmark = brandMarkup();
    for (const id of ['desktop-brand','mobile-brand','splash-brand']) document.getElementById(id).innerHTML = wordmark;
    document.querySelector('#backup-button').innerHTML = `${icon('backup')} <span class="topbar-label">پشتیبان</span>`;
    setTimeout(() => {
      document.querySelector('#splash').hidden = true;
      document.querySelector('#app-shell').inert = false;
    },2000);
    renderStorageLabel();
    updateInstallButton();
    try { database = await openDatabase(); }
    catch { database = null; }
    let saved;
    try { saved = await readStoredState(); }
    catch {
      database?.close();
      database = null;
      try { saved = await readStoredState(); }
      catch {
        renderStorageLabel('ذخیره‌سازی در دسترس نیست');
        toast('مرورگر فضای ذخیره‌سازی را در اختیار برنامه نمی‌گذارد.',true);
      }
    }
    if (saved == null) state = seedState();
    else {
      try {
        const revision = storageRevision(saved);
        checkData(revision >= 0);
        state = {...workspaceData(saved),revision};
      } catch {
        recoveryOnly = true;
        state = {revision:storageRevision(saved),ingredients:[],products:[],batches:[]};
        renderStorageLabel('بازیابی پشتیبان لازم است');
        toast('داده‌های ذخیره‌شده قابل خواندن نیستند. از بخش پشتیبان‌گیری، یک نسخه سالم را بازیابی کنید.',true);
      }
    }
    if (database) database.onversionchange = () => database.close();
    transition(false);
    main.removeAttribute('aria-busy');

    if (location.protocol !== 'file:' && window.isSecureContext && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(() => {
        // Reporting and data entry continue if the browser blocks offline caching.
      });
    }
  }

  init();
  </script>
</body>
</html>
