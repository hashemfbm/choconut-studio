    :root {
      color-scheme:light;
      --ink:#251b33; --text:#3d3348; --muted:#6f657c; --quiet:#ece8f2;
      --purple:#6e40bd; --purple-dark:#57319e; --lavender:#f0e8fc;
      --side:#21172e; --bg:#f7f6fa; --white:#fff; --radius:17px;
      --danger:#a82b48; --green:#1a7157; --border:1px solid var(--quiet);
      --shadow:0 2px 8px #2f204407; --sidebar:232px; --topbar:69px;
      font-family:Vazirmatn,Tahoma,Arial,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.65}
    button,input,select,textarea{font:inherit;color:inherit}
    button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    button:disabled{opacity:.55;cursor:wait}
    :focus-visible{outline:3px solid #a77df1;outline-offset:3px}
    h1,h2,h3,p{margin:0}
    h1{font-size:2.08rem;font-weight:850;line-height:1.3;letter-spacing:-.04em;overflow-wrap:anywhere}
    h2{font-size:1.16rem;font-weight:800;line-height:1.5}
    h3{font-size:1rem;font-weight:780;line-height:1.5}
    small,.small{font-size:.82rem}
    .muted{color:var(--muted)}
    .icon{width:20px;height:20px;flex:none;vertical-align:middle;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round}

      .nutrition-table th:nth-child(n+2){width:22%}
    }
    @media(max-width:500px) {
      .page-head .btn .icon{width:15px;height:15px}
      .page-head .btn{gap:4px}
      .page-head p{max-width:32ch}
      .record-table.dashboard-table{min-width:0}
      .record-table.dashboard-table th:nth-child(2),.record-table.dashboard-table td:nth-child(2){display:none}
      .record-table.dashboard-table td,.record-table.dashboard-table th{padding-inline:7px;font-size:.79rem}
      .record-table.dashboard-table .record-cell{min-width:0;gap:6px}
      .record-table.dashboard-table .row-actions .icon-btn{width:31px;min-width:31px;height:38px}
      .record-table.dashboard-table .thumb{width:28px;height:31px}
      .record-table.dashboard-table .thumb .icon{width:16px;height:16px}
      .field-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
      .ingredient-row{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) 36px}
      .ingredient-row .field-source{grid-column:1/3}
      .ingredient-row .remove-row{grid-column:3;grid-row:1}
      .ingredient-row .field-total{grid-column:1/-1;display:flex;align-items:center;gap:7px}
      .ingredient-row .field-total label{margin:0}
      .ingredient-row .row-total{min-height:25px}
      .tabs{width:100%}
      .tab{flex:1;padding-inline:4px;font-size:.84rem}
      .report-select{width:100%}
      .report-fact span{font-size:.75rem}
      .topbar .btn .icon{width:15px;height:15px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;
  }

  function escapeHtml(value = '') {
    const replacements = {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'};
    return String(value).replace(/[&<>"']/g, symbol => replacements[symbol]);
  }

  function iconButton(action, label, glyph, id = '', extra = '') {
    return `<button type="button" class="icon-btn ${extra}" data-action="${action}" data-id="${escapeHtml(id)}" title="${label}" aria-label="${label}">${icon(glyph)}</button>`;
  }

  function button(action, label, glyph, style = 'outline') {
    return `<button type="button" class="btn ${style}" data-action="${action}">${glyph ? icon(glyph) : ''}${label}</button>`;
  }

  function navLink(view, id = '') {
    return `#${view}${id ? '/' + encodeURIComponent(id) : ''}`;
  }

  function format(value) {
    return value == null || !Number.isFinite(value) ? '—' : numberFormat.format(value);
  }

  function measurement(value, unit) {
    return value == null || !Number.isFinite(value) ? '—' : `${format(value)} ${unit}`;
  }

  function latinDigits(value) {
    return String(value).replace(/[۰-۹٠-٩]/g, char => String(char.charCodeAt(0) % 16));
  }

  function parseNumber(value) {
    const latin = latinDigits(value ?? '').trim().replace(/٫/g, '.').replace(/[٬،\u00a0\u202f]/g, ',');
    if (!latin || !/^(?:(?:\d+|\d{1,3}(?:[, ]\d{3})+)(?:\.\d+)?|\.\d+)$/.test(latin)) return null;
    const parsed = Number(latin.replace(/[, ]/g, ''));
    return Number.isFinite(parsed) ? parsed : null;
  }

  function latestProducts() {
    return [...state.products].sort((a,b) => b.updatedAt - a.updatedAt);
  }

  function nullableInput(value) {
    return value == null ? '' : String(value);
  }

  function newId() {
    return typeof crypto.randomUUID === 'function'
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2,'0')).join('');
  }

  function nutrientsFrom(values = []) {
    return Object.fromEntries(NUTRIENTS.map(({key}, index) => [key, values[index] ?? null]));
  }

    const examples = [
      ['dark-chocolate','شکلات تلخ ۷۰٪',590000,[598,7.8,45.9,42.6,24,10.9,24.5,0,0.06]],
      ['hazelnut','فندق برشته',820000,[646,15,17.6,62.4,4.9,9.4,4.5,0,0.02]],
      ['cocoa','پودر کاکائو',480000,[228,19.6,57.9,13.7,1.8,37,8.1,0,0.05]],
      ['almond','بادام درختی',640000,[579,21.2,21.6,49.9,4.4,12.5,3.8,0,0.01]],
      ['sugar','شکر',68000,[387,0,100,0,100,0,0,0,0]],
      ['cocoa-butter','کره کاکائو',720000,[884,0,0,100,0,0,59.7,0,0]],
    ];
    const ingredients = examples.map(([id,name,price,data]) => ({id,name,price,nutrition:nutrientsFrom(data),sample:true}));
    const baseDate = Date.now();
    const products = [
      ['hazelnut-chocolate','شکلات فندقی دست‌ساز','شکلات تلخ با فندق برشته',980,25,38000,[[0,630],[1,270],[5,100]], 'sample:cocoa'],
      ['cocoa-spread','کرم فندق و کاکائو','کرم فندق با کاکائوی تلخ',510,20,24000,[[1,330],[2,70],[4,70],[5,50]], null],
      ['almond-bites','بایت شکلات و بادام','ترکیب شکلات و بادام درختی',745,30,30000,[[0,480],[3,200],[4,70]], null],
    ].map(([id,name,description,finishedWeight,serving,extraCost,parts,photo], index) => ({
      id,name,description,finishedWeight,serving,extraCost,photo,sample:true,
      updatedAt:baseDate - index * 86400000,
      rows:parts.map(([index,grams]) => ({...snapshot(ingredients[index]),grams})),
    }));
    return {revision:0,ingredients,products};
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      const request = indexedDB.open(STORAGE_KEY, 1);
      request.onupgradeneeded = () => request.result.createObjectStore('workspace');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('Storage is open by another page'));
    });
  }

  function readStoredState() {
    if (!database) return Promise.resolve(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    return new Promise((resolve, reject) => {
      const transaction = database.transaction('workspace', 'readonly');
      const request = transaction.objectStore('workspace').get('data');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function storeState(next, version) {
    const conflict = () => new Error('«چوکو‌نات» در صفحه‌ای دیگر تغییر کرده است. برای دیدن آخرین داده‌ها صفحه را دوباره بارگذاری کنید.');
    if (!database) {
      const save = () => {
        const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if ((current?.revision ?? 0) !== version) throw conflict();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      };
      return navigator.locks ? navigator.locks.request(STORAGE_KEY,save) : Promise.resolve().then(save);
    }
    return new Promise((resolve, reject) => {
      const transaction = database.transaction('workspace', 'readwrite');
      const workspace = transaction.objectStore('workspace');
      const request = workspace.get('data');
      let stale = false;
      request.onsuccess = () => {
        stale = (request.result?.revision ?? 0) !== version;
        if (stale) transaction.abort();
        else workspace.put(next, 'data');
      };
      transaction.oncomplete = resolve;
      transaction.onabort = () => reject(stale ? conflict() : transaction.error);
    });
  }

  async function commit(changes) {
    if (saveInProgress) return false;
    saveInProgress = true;
    try {
      const next = {...state, ...changes, revision:state.revision + 1};
      await storeState(next, state.revision);
      state = next;
      reportFiles = null;
      return true;
    } catch (error) {
      const message = error?.message?.startsWith('«چوکو') ? error.message : 'ذخیره انجام نشد. فضای ذخیره یا تنظیمات مرورگر را بررسی کنید.';
      toast(message, true);
      return false;
    } finally {
      saveInProgress = false;
    }
  }

  function computeRecipe(product) {
    const rows = product.rows.map(row => ({...row, cost:row.price * row.grams / 1000}));
    const rawWeight = rows.reduce((total,row) => total + row.grams, 0);
    const finishedWeight = product.finishedWeight ?? rawWeight;
    const materials = rows.reduce((total,row) => total + row.cost, 0);
    const totalCost = materials + product.extraCost;
    const costPerKg = finishedWeight > 0 ? totalCost * 1000 / finishedWeight : null;
    const nutrition = NUTRIENTS.map(nutrient => {
      const {key} = nutrient;
      const complete = rows.length > 0 && rows.every(row => row.nutrition[key] != null);
      const batch = complete ? rows.reduce((sum,row) => sum + row.nutrition[key] * (row.grams / 100), 0) : null;
      return {
        ...nutrient, batch,
        per100:batch != null && finishedWeight > 0 ? batch * 100 / finishedWeight : null,
        serving:batch != null && product.serving > 0 && finishedWeight > 0 ? batch * product.serving / finishedWeight : null,
      };
    });
    return {rows,rawWeight,finishedWeight,materials,totalCost,costPerKg,nutrition};
  }

  function toast(message, error = false) {
    clearTimeout(toastTimer);
    toastElement.toggleAttribute('data-error', error);
    toastElement.textContent = message;
    toastTimer = setTimeout(() => { toastElement.textContent = ''; }, error ? 6800 : 3600);
  }

  function thumbnail(photo, glyph, style = '') {
    const url = photoUrl(photo);
    return `<span class="thumb" data-sample="${style}">${url ? `<img alt="" src="${url}">` : icon(glyph)}</span>`;
  }

  function photoUrl(photo) {
    if (photo === 'sample:cocoa') return HERO_IMAGE;
    return /^data:image\/jpeg;base64,[\w+/=]+$/.test(photo || '') ? photo : '';
  }

  function pageHead(title, description, action = '') {
    return `<div class="page-head"><div><h1>${title}</h1>${description ? `<p>${description}</p>` : ''}</div>${action}</div>`;
  }

  function emptyMessage(glyph, title, text, action = '') {
    return `<div class="empty"><span>${icon(glyph)}</span><h3>${title}</h3><p>${text}</p>${action}</div>`;
  }

  function newProductLink() {

  }

  function stat(glyph, tone, label, value, unit = '') {
    return `<div class="stat"><span class="stat-icon ${tone}">${icon(glyph)}</span><div><span class="stat-label">${label}</span><strong class="stat-value">${format(value)}${unit && value != null ? `<span>${unit}</span>` : ''}</strong></div></div>`;
  }

  function productTable(products, dashboard = false) {
    if (!products.length) {
      return emptyMessage('box', 'محصولی پیدا نشد', searchText && !dashboard ? 'عبارت دیگری را جست‌وجو کنید.' : 'برای محاسبه بهای تولید، یک محصول بسازید.');
    }
    const rows = products.map(product => {
      const cost = computeRecipe(product);
      return `<tr><td><div class="record-cell">${thumbnail(product.photo,'box', product.sample ? 'cocoa' : '')}
        <div><a href="${navLink('editor',product.id)}">${escapeHtml(product.name)}</a>${product.sample ? '<small>نمونه</small>' : ''}</div></div></td>
        <td class="sort-number" data-label="وزن بچ">${measurement(cost.finishedWeight,'گرم')}</td><td class="sort-number" data-label="بهای کل بچ">${measurement(cost.totalCost,'تومان')}</td>
        <td><div class="row-actions">
        <a class="icon-btn" href="${navLink('reports',product.id)}" title="گزارش محصول" aria-label="گزارش محصول ${escapeHtml(product.name)}">${icon('report')}</a>
        ${dashboard ? '' : iconButton('delete-product','حذف محصول','trash',product.id,'danger')}
        </div></td></tr>`;
    }).join('');
    return `<div class="table-scroll" tabindex="0" role="region" aria-label="جدول محصولات"><table role="table" class="record-table ${dashboard ? 'dashboard-table' : 'catalog-table'}"><thead><tr><th scope="col">محصول</th><th scope="col">وزن بچ</th><th scope="col">بهای کل بچ</th><th scope="col">عملیات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function costChart(product, result) {
    if (!product) return emptyMessage('chart','ترکیب هزینه','پس از ثبت محصول، سهم مواد از بهای بچ اینجا دیده می‌شود.');
    const sorted = [
      ...result.rows.map(({name,cost}) => ({name,cost})),
      ...(product.extraCost > 0 ? [{name:'هزینه‌های جانبی',cost:product.extraCost}] : []),
    ].filter(row => row.cost > 0).sort((a,b) => b.cost-a.cost);
    const summary = sorted.slice(0,4);
    if (sorted.length > 4) {
      summary[3] = {name:'سایر هزینه‌ها',cost:sorted.slice(3).reduce((sum,row) => sum + row.cost,0)};
    }
    return `<div class="cost-chart"><div class="chart-meta"><strong>${format(result.totalCost)} <small>تومان</small></strong><span class="muted">کل بچ</span></div>
      <div class="chart-bar" aria-hidden="true">${summary.map((row,i) => `<span style="flex:${row.cost};background:${COLORS[i]}"></span>`).join('')}</div>
      <ul class="chart-key">${summary.map((row,i) => `<li><i style="background:${COLORS[i]}"></i><span title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span><strong>${percentFormat.format(row.cost / result.totalCost)}</strong></li>`).join('')}</ul>
      ${!summary.length ? '<p class="muted small">هزینه این بچ صفر است.</p>' : ''}
      </div>`;
  }

    main.innerHTML = `${pageHead('پیشخوان تولید','محصولات، مواد اولیه و هزینه‌های تولید را یک‌جا مدیریت کنید.',newProductLink())}
      <section class="hero" aria-labelledby="hero-heading"><div class="hero-content">
        <h2 id="hero-heading">از دستور ساخت<br>تا بهای تمام‌شده</h2>
        <p>بهای هر بچ را محاسبه کنید و برای محصولتان جدول ارزش غذایی بسازید.</p>
        <a class="btn" href="#reports">${icon('report')} مشاهده گزارش‌ها</a>
      </div></section>
      <section class="stats-grid" aria-label="خلاصه تولید">
        ${stat('box','','محصولات',products.length)}

        ${stat('money','rose','بهای آخرین بچ',result?.totalCost,'تومان')}
      </section>
      <div class="dashboard-grid">
        <section class="panel"><div class="panel-head"><h2>محصولات اخیر</h2><a class="btn text" href="#products">همه محصولات</a></div>${productTable(products.slice(0,4),true)}</section>
        <section class="panel"><div class="panel-head"><div><h2>ترکیب هزینه</h2>${latest ? `<p>${escapeHtml(latest.name)}</p>` : ''}</div><span class="stat-icon">${icon('chart')}</span></div>
        <div class="panel-body">${costChart(latest,result)}</div></section>

  function searchKey(value) {
    return latinDigits(value).normalize('NFKC').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\s\u200c\u200d]/g,'').toLowerCase();
  }

  function ingredientTable(ingredients) {
    if (!ingredients.length) {
      return emptyMessage('leaves','ماده‌ای پیدا نشد',searchText ? 'عبارت دیگری را جست‌وجو کنید.' : 'برای استفاده در دستور ساخت، مواد اولیه‌تان را ثبت کنید.');

    const rows = ingredients.map(food => {
      const known = NUTRIENTS.filter(({key}) => food.nutrition[key] != null).length;
      return `<tr><td><div class="record-cell">${thumbnail(null,'leaves')}<div>${escapeHtml(food.name)}${food.sample ? '<small>نمونه</small>' : ''}</div></div></td>

    }).join('');
    return `<div class="table-scroll" tabindex="0" role="region" aria-label="جدول مواد اولیه"><table role="table" class="record-table catalog-table"><thead><tr><th scope="col">شرح ماده غذایی</th><th scope="col">قیمت هر کیلو</th><th scope="col">داده‌های ارزش غذایی</th><th scope="col">عملیات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function updateList() {
    const target = document.querySelector('#record-list');
    const term = searchKey(searchText);
    const match = record => searchKey(record.name).includes(term);
    if (route.view === 'products') target.innerHTML = productTable(latestProducts().filter(match));

  function renderCollection() {

    main.innerHTML = `${ingredients

      : pageHead('محصولات','دستور ساخت را باز کنید یا گزارش محصول را بگیرید.',newProductLink())}
      <div class="toolbar"><div class="search-wrap">${icon('search')}<input type="search" name="search" aria-label="جست‌وجو بر اساس نام" placeholder="جست‌وجو بر اساس نام…" value="${escapeHtml(searchText)}"></div>
      ${emptyOfSamples ? '' : button('clear-samples','پاک‌کردن داده‌های نمونه',null,'text')}</div>
      <section class="panel" id="record-list" aria-label="${ingredients ? 'مواد اولیه ثبت‌شده' : 'محصولات ثبت‌شده'}"></section>`;

  function inputField(id, label, value = '', options = {}) {
    const {name = id, placeholder = '', numeric = false, max = 100, more = '', className = ''} = options;
    return `<div class="${className}"><label for="${id}">${label}</label><input id="${id}" name="${name}" value="${escapeHtml(value)}" placeholder="${placeholder}" maxlength="${max}" ${numeric ? 'inputmode="decimal" autocomplete="off"' : ''} ${more}></div>`;
  }

  function nutritionFields(nutrition) {
    return `<div class="field-grid three">${NUTRIENTS.map(({key,name,unit}) => inputField(`nutrient-${key}`,`${name} (${unit})`,nullableInput(nutrition?.[key]),{name:key,placeholder:'—',numeric:true,max:16})).join('')}</div>`;
  }

  function showDialog(title, content, compact = false) {
    modal.className = compact ? 'dialog-small' : '';
    modal.innerHTML = `<header class="dialog-head"><h2 id="dialog-title">${title}</h2>${iconButton('close-dialog','بستن پنجره','close')}</header>${content}`;
    if (!modal.open) modal.showModal();
  }

  function formMessage(form, text = '') {
    const node = form.querySelector('.form-error');
    if (!node) return;
    node.textContent = text;
    node.hidden = text === '';
  }

  class FormIssue extends Error {}

  function fieldError(input, message) {
    input.setAttribute('aria-invalid','true');
    input.focus();
    throw new FormIssue(message);
  }

  function requiredText(input, message) {
    const value = input.value.trim();
    if (!value) fieldError(input, message);
    return value;
  }

  function readNumber(input, label, options = {}) {
    const {optional = false, min = 0, max = 1000000000} = options;
    if (optional && !input.value.trim()) return null;
    const number = parseNumber(input.value);
    if (number == null || number < min || number > max) {
      fieldError(input, `${label} را با عددی بین ${format(min)} و ${format(max)} وارد کنید.`);
    }
    return number;
  }

  function readNutrition(form) {
    return Object.fromEntries(NUTRIENTS.map(({key,name}) => [key,readNumber(form.elements[key], name, {optional:true,max:100000})]));
  }

  function openIngredient(id = '') {
    const food = state.ingredients.find(record => record.id === id);
    showDialog(food ? 'ویرایش ماده اولیه' : 'افزودن ماده غذایی', `<form id="ingredient-form" novalidate data-id="${escapeHtml(id)}">
      <div class="dialog-body">
        <p role="alert" class="form-error" hidden></p>
        <div class="field-grid">
          ${inputField('food-name','شرح ماده غذایی',food?.name,{name:'name',placeholder:'مثلاً فندق برشته',max:80,more:'required autofocus'})}
          ${inputField('food-price','قیمت هر کیلو (تومان)',nullableInput(food?.price),{name:'price',placeholder:'مثلاً ۳۵۰٬۰۰۰',numeric:true,max:18,more:'required'})}
        </div>
        <h3 class="nutrition-legend">ارزش غذایی در هر ۱۰۰ گرم</h3>
        <p class="field-hint">شاخص‌های نامشخص را خالی بگذارید. اگر مقدار شاخص صفر است، ۰ وارد کنید.</p>
        ${nutritionFields(food?.nutrition)}
      </div>
      <footer class="dialog-actions">${button('close-dialog','انصراف',null)}<button type="submit" class="btn primary">${icon('check')} ذخیره ماده غذایی</button></footer>
      </form>`);
  }

  async function saveIngredient(form) {
    const name = requiredText(form.elements.name,'شرح ماده غذایی را وارد کنید.');
    const price = readNumber(form.elements.price,'قیمت هر کیلو');
    const nutrition = readNutrition(form);
    const id = form.dataset.id || newId();
    const record = {id,name,price,nutrition,sample:false};
    const old = state.ingredients.find(item => item.id === id);
    const ingredients = old ? state.ingredients.map(item => item.id === id ? record : item) : [...state.ingredients,record];
    if (await commit({ingredients})) {
      modal.close();
      if (route.view === 'ingredients') renderCollection();
      if (route.view === 'editor') renderIngredientRows();
      toast('ماده غذایی ذخیره شد.');
    }
  }

  function createDraft(product) {
    return {
      id:product?.id ?? '',
      name:product?.name ?? '',
      description:product?.description ?? '',
      finishedWeight:nullableInput(product?.finishedWeight),
      serving:nullableInput(product?.serving),
      extraCost:nullableInput(product?.extraCost),
      photo:product?.photo ?? null,
      rows:product?.rows.map(row => ({
        ...row, key:newId(), source:row.ingredientId ?? 'custom',
        grams:nullableInput(row.grams), price:nullableInput(row.price), nutrition:{...row.nutrition},
      })) ?? [],
      dirty:false,
      loadingPhoto:false,

  async function saveProduct(form) {
    const name = requiredText(form.elements.name,'نام محصول را وارد کنید.');
    const description = form.elements.description.value.trim();
    const finishedWeight = readNumber(form.elements.finishedWeight,'وزن نهایی بچ',{optional:true,min:.001,max:10000000});
    const serving = readNumber(form.elements.serving,'وزن هر وعده',{optional:true,min:.001,max:10000000});
    const extraCost = readNumber(form.elements.extraCost,'هزینه‌های جانبی',{optional:true}) ?? 0;
    if (!draft.rows.length) throw new FormIssue('دست‌کم یک ماده غذایی به دستور اضافه کنید.');
    if (draft.loadingPhoto) throw new FormIssue('چند لحظه صبر کنید تا عکس آماده شود.');
    const rows = draft.rows.map(row => {
      if (!row.source) fieldError(document.getElementById(`row-source-${row.key}`),'ماده هر ردیف را انتخاب کنید یا «ورود دستی» را بزنید.');
      const label = row.source === 'custom' ? requiredText(document.getElementById(`row-name-${row.key}`),'شرح ماده غذایی دستی را وارد کنید.') : row.name;
      const grams = readNumber(document.getElementById(`row-grams-${row.key}`),'وزن ماده غذایی',{min:.001,max:10000000});
      const price = readNumber(document.getElementById(`row-price-${row.key}`),'قیمت هر کیلو');
      return {ingredientId:row.source === 'custom' ? null : row.source, name:label,grams,price,nutrition:{...row.nutrition}};
    });
    const id = draft.id || newId();
    const product = {id,name,description,rows,finishedWeight,serving,extraCost,photo:draft.photo,updatedAt:Date.now(),sample:false};
    const products = draft.id ? state.products.map(record => record.id === id ? product : record) : [...state.products,product];
    const pendingDraft = draft;
    if (await commit({products})) {
      if (draft === pendingDraft) {
        draft.dirty = false;
        reportKind = 'cost';
        go('reports',id);
      }
      toast('محصول ذخیره شد.');
    }
  }

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Image could not be decoded'));
      image.src = source;
    });
  }

  async function attachPhoto(file) {
    if (!file || !draft || draft.loadingPhoto) return;
    if (file.size > 30 * 1024 * 1024 || file.type === 'image/svg+xml') {
      toast('یک تصویر JPG، PNG یا WebP کوچک‌تر از ۳۰ مگابایت انتخاب کنید.',true);
      return;
    }
    const target = draft;
    target.loadingPhoto = true;
    renderPhotoSlot();
    const url = URL.createObjectURL(file);
    try {
      const image = await loadImage(url);
      const canvas = document.createElement('canvas');
      const ratio = Math.min(1, 1600 / Math.max(image.naturalWidth,image.naturalHeight));
      canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
      const context = canvas.getContext('2d', {alpha:false});
      context.fillStyle = '#fff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const jpeg = canvas.toDataURL('image/jpeg',.88);
      if (!photoUrl(jpeg)) throw new Error('Image encoding failed');
      target.photo = jpeg;
      target.dirty = true;
      if (draft === target) toast('عکس اضافه شد.');
    } catch {
      if (draft === target) toast('عکس خوانده نشد. فایل JPG، PNG یا WebP دیگری انتخاب کنید.',true);
    } finally {
      target.loadingPhoto = false;
      URL.revokeObjectURL(url);
      if (draft === target) renderPhotoSlot();
    }
  }

  // The same report model supplies the screen, PNG pages and PDF pages.
  const exportPalette = {
    ink:'#2a1c39', muted:'#675a75', shade:'#f6f0fb', pale:'#faf7fc',
    purple:'#62399e', dark:'#281938', lilac:'#d8c4fa', paper:'#ffffff',
  };
  const SHEET_WIDTH = 1080;
  const SHEET_HEIGHT = 1528;
  const BANNER_HEIGHT = 1350;
  const PAGE_ROWS = 16;
  const TABLE_TOP = 407;
  const TABLE_HEAD = 57;
  const TABLE_ROW = 53;

  function pageLayout(model,page) {
    const count = Math.max(1,Math.ceil(model.rows.length / PAGE_ROWS));
    return {
      count,
      rows:model.rows.slice(page*PAGE_ROWS,(page+1)*PAGE_ROWS),
      total:page+1 === count ? model.total : null,
    };
  }

  function rectangle(ctx,x,y,width,height,color,radius = 0) {
    ctx.fillStyle = color;
    if (!radius) { ctx.fillRect(x,y,width,height); return; }
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.arcTo(x+width,y,x+width,y+height,radius);
    ctx.arcTo(x+width,y+height,x,y+height,radius);
    ctx.arcTo(x,y+height,x,y,radius);
    ctx.arcTo(x,y,x+width,y,radius);
    ctx.closePath();
    ctx.fill();
  }

  function textStyle(ctx, size, weight, color, align) {
    ctx.font = `${weight} ${size}px Vazirmatn, Tahoma, Arial`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.direction = 'rtl';
  }

  function paintText(ctx,value,x,y,{size = 26, weight = 500, color = exportPalette.ink, align = 'right', limit = 920, fit = false} = {}) {
    textStyle(ctx,size,weight,color,align);
    const text = String(value);
    if (fit || ctx.measureText(text).width <= limit) {
      ctx.fillText(text,x,y,limit);
      return;
    }
    const letters = Array.from(text);
    while (letters.length && ctx.measureText(letters.join('') + '…').width > limit) letters.pop();
    ctx.fillText(letters.join('') + '…',x,y);
  }

  function paintParagraph(ctx,text,x,y,limit,lines,style) {
    if (!text) return;
    const {size = 26,weight = 500,color = exportPalette.ink} = style;
    textStyle(ctx,size,weight,color,'right');
    const words = text.trim().split(/\s+/g);
    let line = '';
    let index = 0;
    while (words.length) {
      const word = words.shift();
      const expanded = [line,word].filter(Boolean).join(' ');
      if (ctx.measureText(expanded).width <= limit || !line) {
        line = expanded;
      } else {
        if (index === lines - 1) {
          paintText(ctx,[line,word,...words].join(' '),x,y + index * (size + 9),{...style,limit});
          return;
        }
        paintText(ctx,line,x,y + index * (size + 9),{...style,limit});
        index += 1;
        line = word;
      }
    }
    paintText(ctx,line,x,y + index * (size + 9),{...style,limit});
  }

  function paintMark(ctx,x,y,scale,color) {
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.65;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(3.5,10.2); ctx.lineTo(12,5.1); ctx.lineTo(20.5,10.2); ctx.lineTo(12,15.3); ctx.closePath();
    ctx.moveTo(3.5,14.5); ctx.lineTo(12,19.6); ctx.lineTo(20.5,14.5);
    ctx.moveTo(8,7.5); ctx.lineTo(16.4,12.6);
    ctx.moveTo(16.2,7.6); ctx.lineTo(7.8,12.7);
    ctx.stroke();
    ctx.restore();
  }

  function paintReportRow(ctx,cells,widths,left,top,width,height,style) {
    rectangle(ctx,left,top,width,height,style.background);
    let right = left + width;
    cells.forEach((cell,index) => {
      const column = widths[index] * width;
      const align = index ? 'center' : 'right';
      const x = index ? right - column / 2 : right - 18;
      paintText(ctx,cell,x,top + height / 2 + 1,{
        size:style.size,weight:style.weight,color:style.color,align,limit:column - 26,fit:true,
      });
      right -= column;
    });
    rectangle(ctx,left,top + height - 1,width,1,'#eae2f0');
  }

  function drawCover(ctx,photo,width,height) {
    const scale = Math.max(width/photo.naturalWidth,height/photo.naturalHeight);
    const w = photo.naturalWidth * scale;
    const h = photo.naturalHeight * scale;
    ctx.drawImage(photo,(width-w)*.5,(height-h)*.45,w,h);
  }

    const hasServing = model.product.serving > 0;

      paintReportRow(ctx,cells,widths,80,top,920,51,{background:index % 2 ? '#f3ebfa' : '#fcfaff',color:colors.ink,size:24,weight:670});
      top += 51;

    paintParagraph(ctx,
      model.hasUnknown ? '— یعنی دادهٔ این شاخص برای بخشی از مواد ثبت نشده است.' : 'ارزش غذایی از مقادیر ثبت‌شده در ترکیبات برآورد شده است.',
      995,1222,905,2,{size:22,color:colors.muted});
    paintText(ctx,'استودیو تولید چوکو‌نات',1018,1312,{size:23,weight:720,color:colors.lilac});

  async function renderCanvas(model,page,compact = false) {
    await document.fonts.ready;
    const canvas = document.createElement('canvas');
    const banner = model.kind === 'banner';
    canvas.width = SHEET_WIDTH;
    canvas.height = banner ? BANNER_HEIGHT : SHEET_HEIGHT;
    if (!banner && compact) {
      const {rows,total} = pageLayout(model,page);
      canvas.height = TABLE_TOP + TABLE_HEAD + rows.length * TABLE_ROW + (total ? TABLE_HEAD : 0) + 164;
    }
    const ctx = canvas.getContext('2d',{alpha:false});
    if (!ctx) throw new Error('Canvas unavailable');
    if (banner) {
      const source = photoUrl(model.product.photo);
      const photo = source ? await loadImage(source) : null;
      paintBanner(ctx,model,photo);
    } else {
      paintSheet(ctx,model,page);
    }
    return canvas;
  }

  function encodeCanvas(canvas, type) {
    return new Promise((resolve,reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('Image encoding failed'));
      },type,.94);
    });
  }

  function imagePdf(images,pageWidth,pageHeight) {
    const encoder = new TextEncoder();
    const parts = [];
    const offsets = [0];
    let bytes = 0;
    function append(chunk) {
      const block = typeof chunk === 'string' ? encoder.encode(chunk) : chunk;
      parts.push(block);
      bytes += block.byteLength;
    }
    function object(id,...chunks) {
      offsets[id] = bytes;
      append(`${id} 0 obj\n`);
      chunks.forEach(append);
      append('\nendobj\n');
    }
    append('%PDF-1.4\n');
    append(new Uint8Array([0x25,0xe2,0xe3,0xcf,0xd3,0x0a]));
    object(1,'<< /Type /Catalog /Pages 2 0 R >>');
    const kids = images.map((_,index) => `${3 + index * 3} 0 R`).join(' ');
    object(2,`<< /Type /Pages /Count ${images.length} /Kids [${kids}] >>`);
    images.forEach(({jpeg,width,height},index) => {
      const id = 3 + index * 3;
      const stream = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Artwork Do\nQ\n`;
      object(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Artwork ${id+1} 0 R >> >> /Contents ${id+2} 0 R >>`);
      object(id+1,`<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`,jpeg,'\nendstream');
      object(id+2,`<< /Length ${stream.length} >>\nstream\n`,stream,'endstream');
    });
    const xref = bytes;
    append(`xref\n0 ${offsets.length}\n0000000000 65535 f \n`);
    offsets.slice(1).forEach(offset => append(`${String(offset).padStart(10,'0')} 00000 n \n`));
    append(`trailer\n<< /Size ${offsets.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts,{type:'application/pdf'});
  }

  function exportBaseName(model) {
    const name = model.product.name.replace(/[<>:"/\\|?*\x00-\x1f\u202a-\u202e\u2066-\u2069]/g,' ').trim().slice(0,70);
    return `${model.title} - ${name || BRAND}`;
  }

  async function makeFiles(model,formatType) {
    const pages = model.kind === 'banner' ? 1 : Math.max(1,Math.ceil(model.rows.length/PAGE_ROWS));
    const base = exportBaseName(model);
    const files = [];
    const images = [];
    for (let page=0; page<pages; page+=1) {
      const canvas = await renderCanvas(model,page,formatType === 'png');
      try {
        if (formatType === 'png') {
          const blob = await encodeCanvas(canvas,'image/png');
          files.push(new File([blob],`${base}${pages > 1 ? ' - ' + (page+1) : ''}.png`,{type:'image/png'}));
        } else {
          const jpeg = await encodeCanvas(canvas,'image/jpeg');
          images.push({width:canvas.width,height:canvas.height,jpeg:new Uint8Array(await jpeg.arrayBuffer())});
        }
      } finally {
        canvas.width = 0;
        canvas.height = 0;
      }
    }
    if (formatType === 'pdf') {
      const banner = model.kind === 'banner';
      const pdf = imagePdf(images,banner ? 540 : 595.28,banner ? 675 : 841.89);
      files.push(new File([pdf],`${base}.pdf`,{type:'application/pdf'}));
    }
    return files;
  }

  function getReportFiles(model,formatType) {
    const key = `${state.revision}/${model.product.id}/${model.kind}`;
    if (reportFiles?.key !== key) reportFiles = {key};
    const group = reportFiles;
    if (!group[formatType]) {
      group[formatType] = makeFiles(model,formatType).catch(error => {
        delete group[formatType];
        throw error;
      });
    }
    return group[formatType];
  }

  function activeReport() {
    const product = state.products.find(product => product.id === reportProductId);
    return product ? reportModel(product,reportKind) : null;
  }

  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = file.name;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  }

  let downloadPages = [];
  let shareState;

  function downloadFiles(files) {
    if (files.length === 1) {
      downloadFile(files[0]);
      toast('فایل برای دانلود آماده شد.');
      return;
    }
    downloadPages = files;
    showDialog('صفحه‌های گزارش',`<div class="dialog-body"><p>هر صفحه را جداگانه به صورت تصویر ذخیره کنید.</p>
      <div class="button-row" style="margin-top:12px">${files.map((_,index) => `<button type="button" class="btn outline" data-action="download-page" data-id="${index}">${icon('photo')} صفحه ${format(index+1)}</button>`).join('')}</div></div>`,true);
  }

  async function downloadReport(formatType,control) {
    const model = activeReport();
    if (!model) return;
    control.disabled = true;
    toast('در حال ساخت خروجی…');
    try {
      const files = await getReportFiles(model,formatType);
      downloadFiles(files);
    } catch {
      toast('ساخت خروجی انجام نشد. دوباره تلاش کنید.',true);
    } finally {
      control.disabled = false;
    }
  }

  function mailtoSummary(model) {
    const summary = [model.product.name, model.title,
      ...model.facts.map(([label,value]) => `${label}  ${value}`), model.note].join('\n');
    return `mailto:?subject=${encodeURIComponent(`${model.title} - ${model.product.name}`)}&body=${encodeURIComponent(summary)}`;
  }

  function openShare() {
    const model = activeReport();
    if (!model) return;
    showDialog('ارسال گزارش',`<div class="dialog-body"><p>${escapeHtml(model.product.name)} · ${model.title}</p>
      <label for="share-format" style="margin-top:12px">فرمت فایل</label>
      <select id="share-format" name="shareFormat"><option value="pdf">PDF</option><option value="png">تصویر PNG</option></select>
      <p class="notice" id="share-status" role="status">در حال آماده‌سازی فایل…</p></div>
      <footer class="dialog-actions">
        <a id="email-report" class="btn outline" href="${escapeHtml(mailtoSummary(model))}" hidden>${icon('mail')} ایمیل خلاصه</a>
        <button type="button" class="btn outline" data-action="share-download" id="share-download" disabled>دانلود فایل</button>
        <button type="button" class="btn primary" data-action="share-file" id="share-file" disabled>${icon('share')} ارسال فایل</button>
      </footer>`,true);
    prepareShare(model,'pdf');
  }

  async function prepareShare(model,formatType) {
    const pending = {model,files:null,canShare:false};
    shareState = pending;
    const status = document.querySelector('#share-status');
    const send = document.querySelector('#share-file');
    const download = document.querySelector('#share-download');
    const email = document.querySelector('#email-report');
    status.textContent = 'در حال آماده‌سازی فایل…';
    send.disabled = true;
    send.hidden = false;
    download.disabled = true;
    email.hidden = true;
    try {
      const files = await getReportFiles(model,formatType);
      if (shareState !== pending || !status.isConnected || !modal.open) return;
      pending.files = files;
      pending.canShare = typeof navigator.share === 'function' && typeof navigator.canShare === 'function' && navigator.canShare({files});
      send.disabled = !pending.canShare;
      send.hidden = !pending.canShare;
      email.hidden = pending.canShare;
      download.disabled = false;
      status.textContent = pending.canShare ? 'فایل آماده ارسال است.' : 'فایل را دانلود کنید و به پیام یا ایمیل پیوست کنید.';
    } catch {
      if (shareState === pending && status.isConnected) status.textContent = 'آماده‌سازی فایل انجام نشد. فرمت را دوباره انتخاب کنید.';
    }
  }

  async function sendSharedFile() {
    if (!shareState?.canShare) return;
    try {
      const {model,files} = shareState;
      await navigator.share({title:`${model.title} - ${model.product.name}`,files});
      modal.close();
    } catch (error) {
      if (error.name !== 'AbortError') toast('ارسال در این مرورگر انجام نشد. می‌توانید فایل را دانلود کنید.',true);
    }
  }

  function brandMarkup(subtitle) {
    return `<span class="brand-mark">${icon('brand')}</span><span><span class="brand-name">${BRAND}</span>${subtitle ? '<span class="brand-sub">استودیو تولید</span>' : ''}</span></span>`;
  }

  function renderShell() {
    const active = route.view === 'editor' ? 'products' : route.view;
    const html = NAV.map(([key,label,glyph]) => `<a class="nav-link" href="#${key}" ${active === key ? 'aria-current="page"' : ''}>${icon(glyph)}<span>${label}</span></a>`).join('');
    document.querySelector('#desktop-nav').innerHTML = html;
    document.querySelector('#mobile-nav').innerHTML = html;
    const label = route.view === 'editor' ? (draft?.id ? 'ویرایش محصول' : 'ساخت محصول جدید') : NAV.find(([key]) => key === active)[1];
    document.querySelector('#breadcrumb').innerHTML = `${icon('brand')}<span>فضای کاری</span><span class="divider" aria-hidden="true">/</span><strong>${label}</strong>`;
    document.title = `${label} | ${BRAND}`;
  }

  function parseRoute() {
    const [view,id = ''] = location.hash.slice(1).split('/');
    if (!['dashboard','products','ingredients','reports','editor'].includes(view)) return {view:'dashboard',id:''};
    try { return {view,id:decodeURIComponent(id)}; }
    catch { return {view,id:''}; }
  }

  function go(view,id = '') {
    const hash = navLink(view,id);
    if (location.hash === hash) transition(false);
    else location.hash = hash;
  }

  function transition(focus = true) {
    if (!state) return;
    const next = parseRoute();
    const changed = route.view !== next.view || route.id !== next.id;
    if (draft?.dirty && changed && !window.confirm('تغییرات محصول ذخیره نشده‌اند. از این صفحه خارج می‌شوید؟')) {
      history.replaceState(null,'',navLink(route.view,route.id));
      return;
    }

    if (changed && modal.open) modal.close();
    if (next.view === 'editor' && (changed || !draft)) {
      const record = state.products.find(product => product.id === next.id);
      if (next.id && next.id !== 'new' && !record) {
        toast('محصول مورد نظر پیدا نشد.',true);
        go('products');
        return;
      }
      draft = createDraft(record);
    } else if (next.view !== 'editor') {
      draft = null;
    }
    if (next.view === 'reports' && route.view !== 'reports') reportKind = 'cost';
    if (next.view !== route.view) searchText = '';
    route = next;
    renderShell();
    if (route.view === 'dashboard') renderDashboard();
    if (route.view === 'products' || route.view === 'ingredients') renderCollection();
    if (route.view === 'editor') renderEditor();
    if (route.view === 'reports') renderReport();
    if (focus && changed) {
      window.scrollTo(0,0);
      main.focus({preventScroll:true});
    }
  }

  let removal;

  function confirmRemoval(kind,id) {
    const item = kind === 'product' ? state.products.find(row => row.id === id) : state.ingredients.find(row => row.id === id);
    if (!item && kind !== 'samples') return;
    const message = item
      ? `«${escapeHtml(item.name)}» از فهرست ${kind === 'product' ? 'محصولات' : 'مواد اولیه'} حذف شود؟`
      : 'محصولات و موادی که با عنوان «نمونه» مشخص شده‌اند، حذف شوند؟';
    removal = {kind,id};
    showDialog('تأیید حذف',`<div class="dialog-body"><p>${message}</p></div><footer class="dialog-actions">
      ${button('close-dialog','انصراف',null)}${button('confirm-remove','حذف','trash','danger')}</footer>`,true);
    modal.querySelector('[data-action="close-dialog"]').focus();
  }

  async function removeRecord() {
    if (!removal) return;
    const {kind,id} = removal;
    const changes = {};
    if (kind === 'product' || kind === 'samples') changes.products = state.products.filter(product => kind === 'samples' ? !product.sample : product.id !== id);
    if (kind === 'ingredient' || kind === 'samples') changes.ingredients = state.ingredients.filter(food => kind === 'samples' ? !food.sample : food.id !== id);
    if (await commit(changes)) {
      modal.close();
      if (route.view === 'products' || route.view === 'ingredients') renderCollection();
      toast('حذف انجام شد.');
    }
  }

  function updateInstallButton() {
    const control = document.querySelector('#install-button');
    control.hidden = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    control.innerHTML = `${icon('phone')} ${installPrompt ? 'نصب برنامه' : 'راهنمای نصب'}`;
  }

  async function installApp() {
    if (installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      try { await prompt.prompt(); }
      catch { toast('گزینه نصب را از منوی مرورگر انتخاب کنید.',true); }
      updateInstallButton();
      return;
    }
    showDialog('نصب چوکو‌نات روی گوشی',`<div class="dialog-body">
      ${location.protocol === 'file:' ? '<p class="notice" style="margin-top:0">برای نصب، نسخهٔ آنلاین چوکو‌نات را با آدرس HTTPS باز کنید.</p>' : ''}
      <p><strong>اندروید</strong><br>در Chrome، از منوی سه‌نقطه گزینهٔ «نصب برنامه» یا «افزودن به صفحه اصلی» را انتخاب کنید.</p>
      <p><strong>آیفون</strong><br>در Safari، دکمهٔ اشتراک‌گذاری را بزنید و «Add to Home Screen» را انتخاب کنید.</p>
      <p><strong>کامپیوتر</strong><br>در Chrome یا Edge، گزینهٔ نصب را در نوار آدرس یا منوی مرورگر انتخاب کنید.</p>
      </div><footer class="dialog-actions">${button('close-dialog','بستن',null,'primary')}</footer>`,true);
  }

  function addDraftRow(custom) {
    const row = makeDraftRow(custom ? 'custom' : '');
    draft.rows.push(row);
    draft.dirty = true;
    renderIngredientRows(row.key,custom ? 'name' : 'source');
  }

  const actions = {
    'new-ingredient':() => openIngredient(),
    'edit-ingredient':(_,id) => openIngredient(id),
    'delete-ingredient':(_,id) => confirmRemoval('ingredient',id),
    'delete-product':(_,id) => confirmRemoval('product',id),
    'clear-samples':() => confirmRemoval('samples'),
    'confirm-remove':removeRecord,
    'close-dialog':() => modal.close(),
    'add-row':() => addDraftRow(false),
    'add-custom-row':() => addDraftRow(true),
    'remove-row':(_,id) => {
      draft.rows = draft.rows.filter(row => row.key !== id);
      draft.dirty = true;
      renderIngredientRows();
    },
    'row-nutrition':(_,id) => openRowNutrition(id),
    'refresh-row':(_,id) => {
      const row = draft.rows.find(row => row.key === id);
      if (!row) return;
      setDraftSource(row,row.source);
      renderIngredientRows(row.key,'price');
    },
    'pick-photo':() => document.querySelector('#photo-file').click(),
    'remove-photo':() => {
      draft.photo = null;
      draft.dirty = true;
      renderPhotoSlot();
    },
    'report-tab':(_,id) => {
      reportKind = id;
      renderReport();
      main.querySelector(`[data-action="report-tab"][data-id="${id}"]`)?.focus({preventScroll:true});
    },
    'download-png':control => downloadReport('png',control),
    'download-pdf':control => downloadReport('pdf',control),
    'share-report':openShare,
    'share-file':sendSharedFile,
    'share-download':() => { if (shareState?.files) downloadFiles(shareState.files); },
    'download-page':(_,id) => {
      const file = downloadPages[Number(id)];
      if (file) downloadFile(file);
    },
    'install':installApp,
  };

  document.addEventListener('click',event => {
    const skip = event.target.closest('.skip-link');
    if (skip) {
      event.preventDefault();
      main.focus();
      return;
    }
    const control = event.target.closest('[data-action]');
    if (!control || !state) return;
    actions[control.dataset.action]?.(control,control.dataset.id);
  });

  document.addEventListener('input',event => {
    const input = event.target;
    input.removeAttribute('aria-invalid');
    if (input.form) formMessage(input.form);
    if (input.name === 'search') {
      searchText = input.value;
      updateList();
    }
    if (input.form?.id !== 'product-form' || !draft) return;
    const rowField = {rowName:'name',rowGrams:'grams',rowPrice:'price'}[input.name];
    if (rowField) {
      const row = draft.rows.find(item => item.key === input.dataset.row);
      if (row) row[rowField] = input.value;
    } else if (['name','description','finishedWeight','serving','extraCost'].includes(input.name)) {
      draft[input.name] = input.value;
    } else {
      return;
    }
    draft.dirty = true;
    updateDraftSummary();
  });

  document.addEventListener('change',event => {
    const input = event.target;
    if (input.name === 'rowSource') {
      const row = draft.rows.find(item => item.key === input.dataset.row);
      if (row) {
        setDraftSource(row,input.value);
        renderIngredientRows(row.key,input.value === 'custom' ? 'name' : 'grams');
      }
    }
    if (input.id === 'photo-file') {
      const file = input.files[0];
      input.value = '';
      if (file) attachPhoto(file);
    }
    if (input.name === 'reportProduct') go('reports',input.value);
    if (input.name === 'shareFormat' && shareState) prepareShare(shareState.model,input.value);
  });

  const formActions = {'product-form':saveProduct,'ingredient-form':saveIngredient,'row-nutrition-form':saveRowNutrition};
  document.addEventListener('submit',async event => {
    const form = event.target;
    const handler = formActions[form.id];
    if (!handler) return;
    event.preventDefault();
    if (saveInProgress) return;
    formMessage(form);
    try { await handler(form); }
    catch (error) {
      if (error instanceof FormIssue) {
        formMessage(form,error.message);
        form.querySelector('.form-error')?.scrollIntoView({block:'nearest'});
      } else {
        toast('در پردازش فرم مشکلی پیش آمد. دوباره تلاش کنید.',true);
      }
    }
  });

  main.addEventListener('dragover',event => {
    if (event.target.closest('#photo-slot')) event.preventDefault();
  });
  main.addEventListener('drop',event => {
    if (!event.target.closest('#photo-slot')) return;
    event.preventDefault();
    if (event.dataTransfer.files.length) attachPhoto(event.dataTransfer.files[0]);
  });
  modal.addEventListener('close',() => {
    shareState = null;
    downloadPages = [];
    removal = null;
  });
  window.addEventListener('hashchange',() => transition());
  window.addEventListener('beforeunload',event => {
    if (draft?.dirty) {
      event.preventDefault();
      event.returnValue = true;
    }
  });
  window.addEventListener('beforeinstallprompt',event => {
    event.preventDefault();
    installPrompt = event;
    updateInstallButton();
  });
  window.addEventListener('appinstalled',() => {
    installPrompt = null;
    document.querySelector('#install-button').hidden = true;
  });

  async function init() {
    document.querySelector('#desktop-brand').innerHTML = brandMarkup(true);
    document.querySelector('#mobile-brand').innerHTML = brandMarkup(false);
    const storage = document.querySelector('#storage-label');
    storage.innerHTML = `${icon('disk')} ذخیره روی این دستگاه`;
    updateInstallButton();
    try { database = await openDatabase(); }
    catch { database = null; }
    try { state = (await readStoredState()) || seedState(); }
    catch {
      database?.close();
      database = null;
      try { state = (await readStoredState()) || seedState(); }
      catch {
        state = seedState();
        storage.innerHTML = `${icon('disk')} ذخیره‌سازی در دسترس نیست`;
        toast('مرورگر فضای ذخیره‌سازی را در اختیار برنامه نمی‌گذارد.',true);
      }
    }
    if (database) database.onversionchange = () => database.close();
    transition(false);
    main.removeAttribute('aria-busy');

    if (location.protocol !== 'file:' && window.isSecureContext && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Reporting and data entry continue if the browser blocks offline caching.
      });
    }
  }

  init();
  </script>
</body>
</html>
