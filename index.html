    :root {
      color-scheme:light;
      --ink:#382015; --text:#493126; --muted:#6e5343; --quiet:#ebded2;
      --accent:#b63a13; --accent-dark:#863110; --accent-soft:#f8e7da; --brand-orange:#ed480e;
      --side:#fff8ee; --bg:#f8f3ee; --white:#fff; --radius:16px;
      --danger:#a82b48; --green:#1a7157; --border:1px solid var(--quiet);
      --shadow:0 2px 8px #3d201008; --sidebar:232px; --topbar:69px;
      font-family:Vazirmatn,Tahoma,Arial,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.65}
    button,input,select,textarea{font:inherit;color:inherit}
    button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
    button,summary{cursor:pointer}
    button,a,summary{touch-action:manipulation}
    a{color:inherit;text-decoration:none}
    button:disabled{opacity:.5;cursor:default}
    :focus-visible{outline:3px solid #cd5b29;outline-offset:3px}
    h1,h2,h3,p{margin:0}
    h1{font-size:2.08rem;font-weight:850;line-height:1.3;letter-spacing:-.04em;overflow-wrap:anywhere}
    h2{font-size:1.16rem;font-weight:800;line-height:1.5}
    h3{font-size:1rem;font-weight:780;line-height:1.5}
    small,.small{font-size:.82rem}
    .muted{color:var(--muted)}

    .calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:14px}
    .calendar-weekday{color:var(--muted);font-size:.82rem;font-weight:680;padding:5px 0}
    .calendar-day{min-height:44px;background:var(--side);color:var(--ink);border:1px solid transparent;border-radius:9px;padding:4px;font-weight:730}
    .calendar-day:hover{border-color:#dcb39c}
    .calendar-day[aria-current=date]{box-shadow:inset 0 0 0 1px var(--accent)}
    .calendar-day[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
    .dialog-small .dialog-body p+p{margin-top:10px}
    .backup-option{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding-block:12px;border-bottom:var(--border)}
    .backup-option p{font-size:.86rem;color:var(--muted)}
    .backup-option:first-child{padding-block-start:0}
    .backup-option:last-of-type{border-bottom:0}
    .backup-status:empty,.dialog-feedback:empty{display:none}
    .backup-status,.dialog-feedback{overflow-wrap:anywhere;margin-top:10px}
    .dialog-feedback{margin:10px 19px;padding:8px 12px;border-radius:8px;background:#f6ede5;color:var(--ink);font-size:.87rem}
    .dialog-feedback[data-error]{background:#fbeef2;color:var(--danger)}
    .confirm-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-block:12px}
    .nutrition-legend{margin-top:16px;font-size:.92rem;font-weight:760}
    .toast{position:fixed;z-index:8;inset-inline-end:20px;inset-block-end:20px;max-width:min(415px,calc(100vw - 35px));padding:11px 16px;border-radius:11px;color:#fff;background:#3b2318;box-shadow:0 7px 24px #3a201537;font-size:.88rem;pointer-events:none}
    .toast:empty{display:none}
    .toast[data-error]{background:#862941}
    @media(max-width:1230px) {
      :root{--sidebar:203px}
      .topbar{padding-inline:25px}
      main{padding-inline:25px}
      .stat{gap:8px;padding:13px 10px}
      .stat-icon{width:34px;height:34px}
      .dashboard-grid{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
    }
    @media(max-width:1030px) {
      .dashboard-grid{grid-template-columns:minmax(0,1fr)}
      .editor-grid{grid-template-columns:minmax(0,1fr)}
      .sticky-panel{position:static}
      .record-table{min-width:490px}
      .stat-value{font-size:1.14rem}
    }
    @media(max-width:860px) {
      :root{--topbar:58px}
      html{scroll-padding-bottom:calc(78px + env(safe-area-inset-bottom))}
      .sidebar,.breadcrumb{display:none}
      .workspace{margin-inline-start:0}
      .topbar{padding-inline:max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-left));gap:8px}
      .topbar-actions{gap:5px}
      .topbar .btn{min-height:44px;padding-inline:8px}
      .mobile-brand{display:block;width:clamp(126px,43vw,184px);flex:none}
      input:not([type=file]),select,textarea,.date-button,.ingredient-row input,.ingredient-row select{font-size:1rem}
      .mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;z-index:5;inset:auto 0 0;gap:4px;background:#fff;border-top:var(--border);padding:4px max(5px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));box-shadow:0 -2px 17px #3c25160a}
      .mobile-nav .nav-link{min-height:48px;display:grid;justify-items:center;justify-content:center;gap:2px;padding:4px 3px;color:var(--muted);border:0;border-radius:8px;font-size:.74rem;text-align:center;line-height:1.35}
      .mobile-nav .nav-link[aria-current=page]{background:#fbe8da;color:#8e2c12}
      .mobile-nav .nav-link[aria-current=page] .icon{color:#ab3b15}
      .mobile-nav .nav-link .icon{width:19px;height:19px}
      main{padding:20px max(13px,env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) max(13px,env(safe-area-inset-left))}
      h1{font-size:1.68rem}
      .page-head{align-items:flex-start;flex-wrap:wrap;margin-bottom:17px;gap:10px}
      .page-head p{font-size:.84rem;margin-top:4px}
      .page-head .btn{font-size:.85rem;padding-inline:10px}
      .hero{min-height:207px;padding:17px 18px}
      .hero h2{max-width:16ch}
      .hero p{max-width:26ch;line-height:1.55;font-size:.85rem}
      .hero::before{background-size:auto 123%;background-position:left center}
      .hero::after{background:linear-gradient(270deg,#311b12 0%,#311b12f5 29%,#311b12b9 54%,#311b123b 100%)}
      .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:13px 0 17px}
      .stat,.panel{border-radius:13px}
      .stat{padding:11px 9px;align-items:center}
      .stat-label{font-size:.79rem}
      .stat-value{font-size:1.15rem}
      .panel-head{padding:11px 12px}
      .panel-body{padding:13px 12px}
      .report-facts{gap:6px}
      .report-fact{padding:8px 7px}
      .report-fact strong{font-size:.91rem}
      .toast{inset-block-end:calc(65px + env(safe-area-inset-bottom));inset-inline-end:12px}
      .banner-preview{padding:10px}
    }
    @media(max-width:900px) {
      .catalog-table{display:block;min-width:0}
      .catalog-table thead{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
      .catalog-table tbody{display:block}
      .catalog-table tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 4px;padding:11px 12px;border-bottom:var(--border)}
      .catalog-table tbody tr:last-child{border-bottom:0}
      .catalog-table tbody td{display:block;border:0;padding:0}
      .catalog-table tbody td:first-child{grid-row:1;grid-column:1;padding-inline-start:0}
      .catalog-table tbody td[data-label]{grid-column:1/-1;padding-inline-start:45px;color:var(--muted);white-space:normal}
      .catalog-table tbody td[data-label]::before{content:attr(data-label) " ";font-weight:680}
      .catalog-table .piece-list{white-space:normal}
      .catalog-table tbody td:last-child{grid-row:1;grid-column:2;padding-inline-end:0}
      .catalog-table .record-cell{min-width:0}
    }
    @media(max-width:640px) {
      .report-table{min-width:0;table-layout:fixed}
      .report-table th:first-child{width:33%}
      .report-table th:nth-child(2){width:15%}
      .report-table th:nth-child(n+3){width:26%}
      .report-table td,.report-table th{font-size:.83rem;padding-inline:6px;white-space:normal;overflow-wrap:anywhere}
      .nutrition-table th:first-child{width:34%}
      .nutrition-table th:nth-child(n+2){width:22%}
      .unit-report-table th:nth-child(n){width:20%}
      .weight-table th:nth-child(n){width:50%}
      .banner-detail-grid{grid-template-columns:minmax(0,1fr)}
      .ingredient-row{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) 44px}
      .ingredient-row .field-source{grid-column:1/3}
      .ingredient-row .remove-row{grid-column:3;grid-row:1}
      .ingredient-row .field-total{grid-column:1/-1;display:flex;align-items:center;gap:7px}
      .ingredient-row .field-total label{margin:0}
      .ingredient-row .row-total{min-height:25px}
      .report-panel .panel-head{align-items:flex-start;flex-wrap:wrap}
    }
    @media(max-width:500px) {
      .page-head .btn .icon{width:16px;height:16px}
      .page-head p{max-width:36ch}
      .field-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
      .product-grid{gap:10px}
      .product-grid-compact{padding:12px}
      .product-card{padding:14px;gap:12px}
      .product-heading{column-gap:11px}
      .product-heading>.thumb{width:50px;height:50px;border-radius:11px}
      .product-heading-text{flex-basis:calc(100% - 61px)}
      .product-actions{margin-inline-start:61px}
      .tabs{width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
      .tab{padding-inline:5px;font-size:.88rem}
      .export-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
      .export-actions .btn{padding-inline:5px}
      .report-fact span{font-size:.75rem}
      .topbar .btn .icon{width:15px;height:15px}
      .mobile-nav .nav-link{font-size:.69rem;font-weight:680;padding-inline:1px}
      dialog:has(.calendar-body){width:calc(100% - 12px)}
      .calendar-body{padding-inline:8px}
    }
    @media(max-width:365px) {
      .topbar .btn{min-width:44px}
      #backup-button .topbar-label{display:none}
      .calendar-days{gap:2px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
      .splash-progress span{animation:none}
    }
  </style>
</head>

  const dateOrder = new Intl.Collator('fa',{numeric:true});

  document.documentElement.style.setProperty('--hero-image', `url("${HERO_IMAGE}")`);

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name]}</svg>`;
  }

  function escapeHtml(value = '') {
    const replacements = {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'};
    return String(value).replace(/[&<>"']/g, symbol => replacements[symbol]);
  }

  function iconButton(action, label, glyph, id = '', extra = '') {
    return `<button type="button" class="icon-btn ${extra}" data-action="${action}" data-id="${escapeHtml(id)}" title="${label}" aria-label="${label}">${icon(glyph)}</button>`;
  }

  function button(action, label, glyph, style = 'outline') {
    return `<button type="button" class="btn ${style}" data-action="${action}">${glyph ? icon(glyph) : ''}${label}</button>`;
  }

  function navLink(view, id = '') {
    return `#${view}${id ? '/' + encodeURIComponent(id) : ''}`;
  }

  function format(value) {
    return value == null || !Number.isFinite(value) ? '—' : numberFormat.format(value);
  }

  function measurement(value, unit) {
    return value == null || !Number.isFinite(value) ? '—' : `${format(value)} ${unit}`;
  }

  function latinDigits(value) {
    return String(value).replace(/[۰-۹٠-٩]/g, char => String(char.charCodeAt(0) % 16));
  }

  function numericLiteral(value) {
    return latinDigits(value ?? '').trim().replace(/[\u061c\u200e\u200f]/g,'')
      .replace(/٫/g,'.').replace(/[٬،\u00a0\u202f ]/g,',');
  }

  function groupedInteger(value) {
    return /^\d+$|^\d{1,3}(?:,\d{3})+$/.test(value);
  }

  function parseNumber(value) {
    const literal = numericLiteral(value);
    const [whole,fraction,extra] = literal.split('.');
    if (extra !== undefined || (whole && !groupedInteger(whole)) || (fraction !== undefined && !/^\d+$/.test(fraction))) return null;
    if (!whole && fraction === undefined) return null;
    const parsed = Number(literal.replaceAll(',',''));
    return Number.isFinite(parsed) ? parsed : null;
  }

  function formatNumericInput(input,inputType) {
    const original = input.value;
    const literal = numericLiteral(original);
    if (!/^[0-9,]*(?:\.\d*)?$/.test(literal)) return;
    const [whole,fraction] = literal.split('.');
    if (inputType === 'insertFromPaste' && whole.includes(',') && !groupedInteger(whole)) return;
    const groups = whole.replaceAll(',','').replace(/\B(?=(\d{3})+(?!\d))/g,'٬');
    const display = (groups + (fraction === undefined ? '' : '٫' + fraction))
      .replace(/[0-9]/g,digit => '۰۱۲۳۴۵۶۷۸۹'[Number(digit)]);
    if (original === display) return;
    function mappedCaret(index) {
      const significant = /[0-9۰-۹٠-٩.٫]/;
      let remaining = Array.from(original.slice(0,index)).filter(char => significant.test(char)).length;
      let caret = 0;
      while (remaining > 0 && caret < display.length) {
        if (significant.test(display[caret])) remaining -= 1;
        caret += 1;
      }
      return caret;
    }
    const start = mappedCaret(input.selectionStart ?? original.length);
    const end = mappedCaret(input.selectionEnd ?? original.length);
    input.value = display;
    input.setSelectionRange(start,end);
  }

  function latestProducts() {
    return [...state.products,...state.batches].sort((a,b) => b.updatedAt - a.updatedAt);
  }

  function nullableInput(value) {
    return value == null ? '' : inputNumberFormat.format(value);
  }

  function newId() {
    return typeof crypto.randomUUID === 'function'
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2,'0')).join('');
  }

  function nutrientsFrom(values = []) {
    return Object.fromEntries(NUTRIENTS.map(({key}, index) => [key, values[index] ?? null]));
  }

  function unitGrams(unit,packGrams) {
    if (unit === 'kg') return 1000;
    if (unit === 'g') return 1;
    return packGrams;
  }

  function pricePerKilo(pricing) {
    return pricing ? pricing.amount * (1000 / unitGrams(pricing.unit,pricing.packGrams)) : null;
  }

  function priceUnitLabel(pricing) {
    return pricing.unit === 'pack' ? `بستهٔ ${format(pricing.packGrams)} گرمی` : PRICE_UNITS[pricing.unit];
  }

  function validDay(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const date = new Date(`${value}T12:00:00Z`);
    return Number.isFinite(date.valueOf()) && date.toISOString().slice(0,10) === value && value >= FIRST_DATE;
  }

  function utcDay(value) {
    return Date.parse(`${value}T00:00:00Z`) / DAY_MS;
  }

  function isoDay(day) {
    return new Date(day * DAY_MS).toISOString().slice(0,10);
  }

  function persianDate(day) {
    const parts = persianPartsFormat.formatToParts(new Date(day * DAY_MS));
    return Object.fromEntries(parts.filter(part => part.type !== 'literal').map(({type,value}) => [type,Number(value)]));
  }

  function persianMonthStart(year,month) {
    // Locate the first day with this Persian year and month using the browser's calendar.
    let low = Date.UTC(year + 621,0,1) / DAY_MS;
    let high = Date.UTC(year + 623,0,1) / DAY_MS;
    while (low < high) {
      const middle = Math.floor((low + high) / 2);
      const current = persianDate(middle);
      if (current.year * 12 + current.month < year * 12 + month) low = middle + 1;
      else high = middle;
    }
    return low;
  }

  function shiftPersianMonth(year,month,change) {
    const index = year * 12 + month - 1 + change;
    return {year:Math.floor(index / 12),month:index % 12 + 1};
  }

  function calendarMonth(year,month) {
    const first = persianMonthStart(year,month);
    const next = shiftPersianMonth(year,month,1);
    const last = persianMonthStart(next.year,next.month) - 1;
    const offset = (new Date(first * DAY_MS).getUTCDay() + 1) % 7;
    return {first,last,offset};
  }

  function todayTehran() {
    const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts();
    const {year,month,day} = Object.fromEntries(parts.map(({type,value}) => [type,value]));
    return `${year}-${month}-${day}`;
  }

  function displayDay(value) {
    return validDay(value) ? dayFormat.format(new Date(`${value}T12:00:00Z`)) : '—';
  }

  function snapshot(food) {
    return {
      ingredientId:food.id,name:food.name,price:pricePerKilo(food.pricing),
      priceAt:food.pricing?.updatedAt ?? null,nutrition:{...food.nutrition},
    };
  }

  function checkData(condition) {
    if (!condition) throw new Error('Invalid workspace data');
  }

  function dataObject(value) {
    checkData(value !== null && typeof value === 'object' && !Array.isArray(value));
    return value;
  }

  function dataId(value,reserved) {
    checkData(typeof value === 'string' && /^[a-zA-Z0-9_-]{1,80}$/.test(value) && value !== reserved);
    return value;
  }

  function dataText(value,max,optional = false) {
    checkData(typeof value === 'string' && value.length <= max && (optional || value.trim()));
    return value;
  }

  function dataNumber(value,min,max,optional = false) {
    if (optional && value === null) return null;
    checkData(Number.isFinite(value) && value >= min && value <= max);
    return value;
  }

  function dataTimestamp(value) {
    return dataNumber(value ?? null,0,8640000000000000,true);
  }

  function dataPricing(food) {
    const value = food.pricing;
    if (value === undefined && food.price != null) {
      return {amount:dataNumber(food.price,0,MAX_KILO_PRICE),unit:'kg',packGrams:null,updatedAt:null};
    }
    if (value == null) return null;
    const {amount,unit,packGrams,updatedAt} = dataObject(value);
    checkData(Object.hasOwn(PRICE_UNITS,unit));
    const pricing = {
      amount:dataNumber(amount,0,MAX_KILO_PRICE),unit,
      packGrams:unit === 'pack' ? dataNumber(packGrams,.001,MAX_GRAMS) : null,
      updatedAt:dataTimestamp(updatedAt),
    };
    checkData(pricePerKilo(pricing) <= MAX_KILO_PRICE);
    return pricing;
  }

  function dataNutrition(value) {
    const record = dataObject(value);
    return Object.fromEntries(NUTRIENTS.map(({key}) => [key,dataNumber(record[key] ?? null,0,100000,true)]));
  }

  function dataPhoto(value,checkHeader) {
    if (value === null || value === 'sample:cocoa') return value;
    checkData(typeof value === 'string' && value.length <= 6 * 1024 * 1024 && photoUrl(value));
    if (checkHeader) {
      const binary = atob(value.slice(JPEG_PREFIX.length,JPEG_PREFIX.length + 262144));
      const size = jpegSize(Uint8Array.from(binary,char => char.charCodeAt(0)));
      checkData(size && size.width > 0 && size.height > 0 && size.width <= PHOTO_EDGE && size.height <= PHOTO_EDGE);
    }
    return value;
  }

  function dataRecipe(input,verifyPhotos) {
    const product = dataObject(input);
    checkData(Array.isArray(product.rows) && product.rows.length > 0);
    return {
      id:dataId(product.id,'new'),
      name:dataText(product.name,85),description:dataText(product.description,210,true),
      finishedWeight:dataNumber(product.finishedWeight ?? null,.001,MAX_GRAMS,true),
      serving:dataNumber(product.serving ?? null,.001,MAX_GRAMS,true),
      bannerWeight:dataNumber(product.bannerWeight ?? null,.001,MAX_GRAMS,true),
      extraCost:dataNumber(product.extraCost,0,1000000000),
      photo:dataPhoto(product.photo,verifyPhotos),
      updatedAt:dataNumber(product.updatedAt,0,Number.MAX_SAFE_INTEGER),sample:product.sample === true,
      rows:product.rows.map(part => {
        const row = dataObject(part);
        return {
          ingredientId:row.ingredientId === null ? null : dataId(row.ingredientId,'custom'),
          name:dataText(row.name,80),grams:dataNumber(row.grams,.001,MAX_GRAMS),
          price:dataNumber(row.price,0,MAX_KILO_PRICE),priceAt:dataTimestamp(row.priceAt),
          nutrition:dataNutrition(row.nutrition),
        };
      }),
    };
  }

  function workspaceData(raw,verifyPhotos = false) {
    const {ingredients,products,batches = []} = dataObject(raw);
    checkData(Array.isArray(ingredients) && Array.isArray(products) && Array.isArray(batches));
    const cleanIngredients = ingredients.map(input => {
      const food = dataObject(input);
      return {
        id:dataId(food.id,'custom'),name:dataText(food.name,80),pricing:dataPricing(food),
        nutrition:dataNutrition(food.nutrition),sample:food.sample === true,
      };
    });
    const cleanProducts = products.map(input => dataRecipe(input,verifyPhotos));
    const cleanBatches = batches.map(input => {
      const batch = dataRecipe(input,verifyPhotos);
      batch.number = dataText(input.number,40);
      checkData(searchKey(batch.number) && validDay(input.date));
      batch.date = input.date;
      if (input.quantity !== undefined) {
        checkData(Number.isSafeInteger(input.quantity) && input.quantity > 0);
        batch.quantity = input.quantity;
        batch.finishedWeight = null;
      } else {
        checkData(Array.isArray(input.molds) && input.molds.length > 0);
        batch.molds = input.molds.map(value => {
          const {grams,quantity} = dataObject(value);
          checkData(quantity === null || (Number.isSafeInteger(quantity) && quantity > 0));
          return {grams:dataNumber(grams,.001,MAX_GRAMS),quantity};
        });
      }
      const allocation = computeRecipe(batch).allocation;
      checkData(allocation.valid);
      return batch;
    });
    for (const collection of [cleanIngredients,cleanProducts,cleanBatches]) {
      checkData(new Set(collection.map(record => record.id)).size === collection.length);
    }
    checkData(new Set(cleanBatches.map(record => searchKey(record.number))).size === cleanBatches.length);
    return {ingredients:cleanIngredients,products:cleanProducts,batches:cleanBatches};
  }

  function seedState() {
    const examples = [
      ['dark-chocolate','شکلات تلخ ۷۰٪',590000,[598,7.8,45.9,42.6,24,10.9,24.5,0,0.06]],
      ['hazelnut','فندق برشته',820000,[646,15,17.6,62.4,4.9,9.4,4.5,0,0.02]],
      ['cocoa','پودر کاکائو',480000,[228,19.6,57.9,13.7,1.8,37,8.1,0,0.05]],
      ['almond','بادام درختی',640000,[579,21.2,21.6,49.9,4.4,12.5,3.8,0,0.01]],
      ['sugar','شکر',68000,[387,0,100,0,100,0,0,0,0]],
      ['cocoa-butter','کره کاکائو',720000,[884,0,0,100,0,0,59.7,0,0]],
    ];
    const ingredients = examples.map(([id,name,price,data]) => ({

      ['hazelnut-chocolate','شکلات فندقی دست‌ساز','شکلات تلخ با فندق برشته',980,25,38000,[[0,630],[1,270],[5,100]], 'sample:cocoa'],
      ['cocoa-spread','کرم فندق و کاکائو','کرم فندق با کاکائوی تلخ',510,20,24000,[[1,330],[2,70],[4,70],[5,50]], null],
      ['almond-bites','بایت شکلات و بادام','ترکیب شکلات و بادام درختی',745,30,30000,[[0,480],[3,200],[4,70]], null],
    ].map(([id,name,description,finishedWeight,serving,extraCost,parts,photo], index) => ({

  function openDatabase() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      const request = indexedDB.open(STORAGE_KEY, 1);
      request.onupgradeneeded = () => request.result.createObjectStore('workspace');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('Storage is open by another page'));
    });
  }

  function readStoredState() {
    if (!database) return Promise.resolve(JSON.parse(localStorage.getItem(STORAGE_KEY)));
    return new Promise((resolve, reject) => {
      const transaction = database.transaction('workspace', 'readonly');
      const request = transaction.objectStore('workspace').get('data');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function storageRevision(value) {
    if (value == null) return 0;
    return Number.isSafeInteger(value.revision) && value.revision >= 0 ? value.revision : -1;
  }

  function storeState(next, version) {
    const conflict = () => new Error('«چوکو‌نات» در صفحه‌ای دیگر تغییر کرده است. برای دیدن آخرین داده‌ها صفحه را دوباره بارگذاری کنید.');
    if (!database) {
      const save = () => {
        const current = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (storageRevision(current) !== version) throw conflict();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      };
      return navigator.locks ? navigator.locks.request(STORAGE_KEY,save) : Promise.resolve().then(save);
    }
    return new Promise((resolve, reject) => {
      const transaction = database.transaction('workspace', 'readwrite');
      const workspace = transaction.objectStore('workspace');
      const request = workspace.get('data');
      let stale = false;
      request.onsuccess = () => {
        stale = storageRevision(request.result) !== version;
        if (stale) transaction.abort();
        else workspace.put(next, 'data');
      };
      transaction.oncomplete = resolve;
      transaction.onabort = () => reject(stale ? conflict() : transaction.error);
    });
  }

  async function commit(changes,{restore = false} = {}) {
    if (saveInProgress) return false;
    if (recoveryOnly && !restore) {
      toast('ابتدا یک پشتیبان سالم را بازیابی کنید.',true);
      return false;
    }
    saveInProgress = true;
    try {
      const revision = state.revision >= 0 && state.revision < Number.MAX_SAFE_INTEGER ? state.revision + 1 : 1;
      const next = {...state, ...changes, revision};
      await storeState(next, state.revision);
      state = next;
      recoveryOnly = false;
      reportFiles = null;
      return true;
    } catch (error) {
      const message = error?.message?.startsWith('«چوکو') ? error.message : 'ذخیره انجام نشد. فضای ذخیره یا تنظیمات مرورگر را بررسی کنید.';
      toast(message, true);
      return false;
    } finally {
      saveInProgress = false;
    }
  }

  function allocateMolds(molds,finishedWeight,totalCost) {
    const tolerance = Math.max(finishedWeight,1) * Number.EPSILON * 12;
    const fixed = molds.reduce((sum,mold) => sum + mold.grams * (mold.quantity ?? 0),0);
    const remaining = finishedWeight - fixed;
    const auto = molds.filter(mold => mold.quantity === null);
    const automaticCount = auto.length === 1
      ? Math.max(0,Math.floor((remaining + tolerance) / auto[0].grams)) : 0;
    const valid = molds.length > 0 && remaining >= -tolerance && auto.length <= 1
      && (!auto.length || (Number.isSafeInteger(automaticCount) && automaticCount > 0));
    const costPerGram = finishedWeight > 0 ? totalCost / finishedWeight : 0;
    const groups = molds.map(mold => {
      const quantity = mold.quantity ?? automaticCount;
      const unitCost = mold.grams * costPerGram;
      return {...mold,quantity,unitCost,weight:mold.grams * quantity,cost:unitCost * quantity};
    });
    const used = groups.reduce((sum,group) => sum + group.weight,0);
    const residual = finishedWeight - used;
    const leftover = residual > tolerance ? residual : 0;
    return {
      groups,valid,used,leftover,leftoverCost:leftover * costPerGram,
      units:groups.reduce((sum,group) => sum + group.quantity,0),
      reason:auto.length > 1 ? 'multiple-auto' : remaining < -tolerance ? 'overweight' : !automaticCount && auto.length ? 'no-piece' : '',
    };
  }

  function computeRecipe(product) {
    const rows = product.rows.map(row => ({...row, cost:row.price * row.grams / 1000}));
    const rawWeight = rows.reduce((total,row) => total + row.grams, 0);
    const {quantity} = product;
    const finishedWeight = quantity == null ? product.finishedWeight ?? rawWeight : rawWeight;
    const materials = rows.reduce((total,row) => total + row.cost, 0);
    const totalCost = materials + product.extraCost;
    const costPerKg = finishedWeight > 0 ? totalCost * 1000 / finishedWeight : null;
    let allocation = null;
    if (quantity != null) {
      const valid = rawWeight > 0 && Number.isSafeInteger(quantity) && quantity > 0;
      allocation = {groups:[],valid,used:rawWeight,leftover:0,leftoverCost:0,units:quantity};
      if (valid) allocation.groups.push({
        grams:Math.round(rawWeight / quantity),quantity,unitCost:totalCost / quantity,weight:rawWeight,cost:totalCost,
      });
    } else if (product.molds) {
      allocation = allocateMolds(product.molds,finishedWeight,totalCost);
    }
    const serving = product.serving ?? (allocation?.groups[0]?.grams || (quantity > 0 && finishedWeight > 0 ? finishedWeight / quantity : null));
    const nutrition = NUTRIENTS.map(nutrient => {
      const {key} = nutrient;
      const complete = rows.length > 0 && rows.every(row => row.nutrition[key] != null);
      const batch = complete ? rows.reduce((sum,row) => sum + row.nutrition[key] * (row.grams / 100), 0) : null;
      return {
        ...nutrient, batch,
        per100:batch != null && finishedWeight > 0 ? batch * 100 / finishedWeight : null,
        serving:batch != null && serving > 0 && finishedWeight > 0 ? batch * serving / finishedWeight : null,
      };
    });
    return {rows,rawWeight,finishedWeight,materials,totalCost,costPerKg,nutrition,allocation,serving};
  }

  function toast(message, error = false) {
    clearTimeout(toastTimer);
    const feedback = modal.open && modal.querySelector('.dialog-feedback');
    if (feedback) {
      toastElement.textContent = '';
      feedback.toggleAttribute('data-error',error);
      feedback.textContent = message;
      return;
    }
    toastElement.toggleAttribute('data-error', error);
    toastElement.textContent = message;
    toastTimer = setTimeout(() => { toastElement.textContent = ''; }, error ? 6800 : 3600);
  }

  function thumbnail(photo, glyph, style = '') {
    const url = photoUrl(photo);
    return `<span class="thumb" data-sample="${style}">${url ? `<img alt="" src="${url}">` : icon(glyph)}</span>`;
  }

  function photoUrl(photo) {
    if (photo === 'sample:cocoa') return HERO_IMAGE;
    if (typeof photo !== 'string' || !photo.startsWith(JPEG_PREFIX + '/9j/')) return '';
    const encoded = photo.slice(JPEG_PREFIX.length);
    return encoded.length % 4 === 0 && /^[A-Za-z0-9+/]+={0,2}$/.test(encoded) ? photo : '';
  }

  function pageHead(title, description, action = '') {
    return `<div class="page-head"><div><h1>${title}</h1>${description ? `<p>${description}</p>` : ''}</div>${action}</div>`;
  }

  function emptyMessage(glyph, title, text, action = '') {
    return `<div class="empty"><span>${icon(glyph)}</span><h3>${title}</h3><p>${text}</p>${action}</div>`;
  }

  function newBatchLink() {
    return `<a class="btn primary" href="#batch/new">${icon('plus')} ثبت تولید جدید</a>`;
  }

  function isBatchRecord(record) {
    return typeof record.number === 'string';
  }

  function reportId(record) {
    return isBatchRecord(record) ? `batch.${record.id}` : record.id;
  }

  function findReport(id) {
    if (id.startsWith('batch.')) return state.batches.find(batch => batch.id === id.slice(6));
    return state.products.find(product => product.id === id);
  }

  function productCode(product) {
    // Keep the internal product code stable across edits and backup restores.
    let hash = 0xcbf29ce484222325n;
    for (const char of reportId(product)) hash = BigInt.asUintN(64,(hash ^ BigInt(char.charCodeAt(0))) * 0x100000001b3n);
    return `CN-${hash.toString(36).toUpperCase().padStart(13,'0')}`;
  }

  function batchEntries(sort = 'date') {
    const entries = state.batches.map(batch => ({batch,result:computeRecipe(batch)}));
    const byDate = (a,b) => b.batch.date.localeCompare(a.batch.date) || b.batch.updatedAt - a.batch.updatedAt;
    const byUnit = item => item.result.allocation.groups.reduce((lowest,group) => Math.min(lowest,group.unitCost),Infinity);
    const comparators = {
      date:byDate,
      number:(a,b) => dateOrder.compare(a.batch.number,b.batch.number) || byDate(a,b),
      cost:(a,b) => b.result.totalCost - a.result.totalCost || byDate(a,b),
      unit:(a,b) => byUnit(b) - byUnit(a) || byDate(a,b),
    };
    return entries.sort(comparators[sort]);
  }

  function stat(glyph, tone, label, value, unit = '') {
    return `<div class="stat"><span class="stat-icon ${tone}">${icon(glyph)}</span><div><span class="stat-label">${label}</span><strong class="stat-value">${format(value)}${unit && value != null ? `<span>${unit}</span>` : ''}</strong></div></div>`;
  }

  function productGrid(products, dashboard = false) {
    if (!products.length) {
      const searching = searchText && !dashboard;
      return emptyMessage('box','محصولی پیدا نشد',searching ? 'نام یا شمارهٔ دیگری را جست‌وجو کنید.' : 'با ثبت تولید، محصول به این فهرست اضافه می‌شود.',searching ? '' : newBatchLink());
    }
    const cards = products.map(product => {
      const result = computeRecipe(product);
      const batch = isBatchRecord(product);
      const summary = batch ? `<bdi class="record-code">${escapeHtml(product.number)}</bdi><span>${displayDay(product.date)}</span>`
        : product.sample ? '<span>نمونه</span>' : '';
      return `<li><a class="product-card" data-product-link href="${navLink('products',reportId(product))}">
        <div class="product-card-head">${thumbnail(product.photo,'box',product.sample ? 'cocoa' : '')}
          <div>${dashboard ? '<h3>' : '<h2>'}${escapeHtml(product.name)}${dashboard ? '</h3>' : '</h2>'}${summary ? `<div class="product-meta">${summary}</div>` : ''}</div>
          <span class="product-chevron">${icon('left')}</span>
        </div>
        <dl class="product-metrics">
          <div><dt>وزن کل</dt><dd>${measurement(result.finishedWeight,'گرم')}</dd></div>
          <div><dt>بهای کل</dt><dd>${measurement(result.totalCost,'تومان')}</dd></div>
        </dl>
      </a></li>`;
    }).join('');
    return `<ul class="product-grid${dashboard ? ' product-grid-compact' : ''}">${cards}</ul>`;
  }

  function costChart(product, result) {
    if (!product) return emptyMessage('chart','ترکیب هزینه','پس از ثبت محصول، سهم مواد از بهای بچ اینجا دیده می‌شود.');
    const sorted = [
      ...result.rows.map(({name,cost}) => ({name,cost})),
      ...(product.extraCost > 0 ? [{name:'هزینه‌های جانبی',cost:product.extraCost}] : []),
    ].filter(row => row.cost > 0).sort((a,b) => b.cost-a.cost);
    const summary = sorted.slice(0,4);
    if (sorted.length > 4) {
      summary[3] = {name:'سایر هزینه‌ها',cost:sorted.slice(3).reduce((sum,row) => sum + row.cost,0)};
    }
    return `<div class="cost-chart"><div class="chart-meta"><strong>${format(result.totalCost)} <small>تومان</small></strong><span class="muted">کل بچ</span></div>
      <div class="chart-bar" aria-hidden="true">${summary.map((row,i) => `<span style="flex:${row.cost};background:${COLORS[i]}"></span>`).join('')}</div>
      <ul class="chart-key">${summary.map((row,i) => `<li><i style="background:${COLORS[i]}"></i><span title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</span><strong>${percentFormat.format(row.cost / result.totalCost)}</strong></li>`).join('')}</ul>
      ${!summary.length ? '<p class="muted small">هزینه این بچ صفر است.</p>' : ''}
      </div>`;
  }

    const result = latest ? computeRecipe(latest) : null;
    main.innerHTML = `${pageHead('پیشخوان تولید','خلاصهٔ نوبت‌های تولید و محصولات چوکونات.',newBatchLink())}
      <section class="hero" aria-labelledby="hero-heading"><div class="hero-content">
        <h2 id="hero-heading">از دستور ساخت<br>تا بهای تمام‌شده</h2>
        <p>بهای هر بچ را محاسبه کنید و برای محصولتان جدول ارزش غذایی بسازید.</p>
        <a class="btn" href="#products">${icon('box')} مشاهده محصولات</a>
      </div></section>
      <section class="stats-grid" aria-label="خلاصه تولید">
        ${stat('box','','نوبت‌های تولید',state.batches.length)}
        ${stat('leaves','mint','مواد اولیه',state.ingredients.length)}
        ${stat('scale','amber','وزن آخرین محصول',result?.finishedWeight,'گرم')}

      </section>

        <section class="panel"><div class="panel-head"><h2>محصولات اخیر</h2><a class="btn text" href="#products">همه محصولات</a></div>${productGrid(products.slice(0,4),true)}</section>
        <section class="panel"><div class="panel-head"><div><h2>ترکیب هزینه</h2>${latest ? `<p>${escapeHtml(latest.name)}</p>` : ''}</div><span class="stat-icon">${icon('chart')}</span></div>
        <div class="panel-body">${costChart(latest,result)}</div></section>
      </div>`;
  }

  function searchKey(value) {
    return latinDigits(value).normalize('NFKC').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\s\u200c\u200d]/g,'').toLowerCase();
  }

  function ingredientTable(ingredients) {
    if (!ingredients.length) {
      return emptyMessage('leaves','ماده‌ای پیدا نشد',searchText ? 'عبارت دیگری را جست‌وجو کنید.' : 'برای استفاده در دستور ساخت، مواد اولیه‌تان را ثبت کنید.');

    const rows = ingredients.map(food => {
      const known = NUTRIENTS.filter(({key}) => food.nutrition[key] != null).length;
      return `<tr><td><div class="record-cell">${thumbnail(null,'leaves')}<div>${escapeHtml(food.name)}${food.sample ? '<small>نمونه</small>' : ''}</div></div></td>
        <td class="sort-number" data-label="ارزش غذایی">${known ? `${format(known)} از ${format(NUTRIENTS.length)} شاخص` : '—'}</td>
        <td><div class="row-actions">${iconButton('edit-ingredient','ویرایش ماده اولیه','pen',food.id)}${iconButton('delete-ingredient','حذف ماده اولیه','trash',food.id,'danger')}</div></td></tr>`;
    }).join('');
    return `<div class="table-scroll" tabindex="0" role="region" aria-label="جدول مواد اولیه"><table role="table" class="record-table catalog-table"><thead><tr><th scope="col">شرح ماده غذایی</th><th scope="col">داده‌های ارزش غذایی</th><th scope="col">عملیات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function priceTable(ingredients) {
    if (!ingredients.length) {
      return emptyMessage('money','ماده‌ای برای قیمت‌گذاری پیدا نشد',searchText ? 'نام دیگری را جست‌وجو کنید.' : 'ابتدا یک مادهٔ غذایی ثبت کنید.',
        searchText ? '' : '<a href="#ingredients" class="btn outline">مواد اولیه</a>');
    }
    const rows = ingredients.map(food => {
      const {pricing} = food;
      return `<tr><td><div class="record-cell">${thumbnail(null,'money')}<div>${escapeHtml(food.name)}${food.sample ? '<small>نمونه</small>' : ''}</div></div></td>
        <td data-label="واحد قیمت">${pricing ? priceUnitLabel(pricing) : '—'}</td>
        <td class="sort-number" data-label="قیمت واحد">${pricing ? measurement(pricing.amount,'تومان') : 'ثبت نشده'}</td>
        <td data-label="آخرین به‌روزرسانی">${pricing?.updatedAt != null ? priceDateFormat.format(pricing.updatedAt) : 'ثبت نشده'}</td>
        <td><div class="row-actions"><button type="button" class="btn outline" data-action="edit-price" data-id="${food.id}" aria-label="ثبت قیمت ${escapeHtml(food.name)}">${icon('pen')} ${pricing ? 'ویرایش' : 'ثبت قیمت'}</button></div></td></tr>`;
    }).join('');
    return `<div class="table-scroll" tabindex="0" role="region" aria-label="جدول قیمت‌ها"><table role="table" class="record-table catalog-table">
      <thead><tr><th scope="col">ماده غذایی</th><th scope="col">واحد قیمت</th><th scope="col">قیمت واحد</th><th scope="col">آخرین به‌روزرسانی</th><th scope="col">عملیات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function batchTable(entries) {
    if (!entries.length) {
      return emptyMessage('scale','تولیدی پیدا نشد',searchText ? 'شماره یا نام دیگری را جست‌وجو کنید.' : 'با ثبت مواد مصرفی و تعداد واحد، اولین تولید را اضافه کنید.');
    }
    const rows = entries.map(({batch,result}) => `<tr>
      <td><div class="record-cell">${thumbnail(batch.photo,'scale')}<div><a class="record-link" href="${navLink('batch',batch.id)}"><bdi class="record-code">${escapeHtml(batch.number)}</bdi></a><small>${escapeHtml(batch.name)}</small></div></div></td>
      <td data-label="تاریخ تولید">${displayDay(batch.date)}</td>
      <td class="sort-number" data-label="وزن کل">${measurement(result.finishedWeight,'گرم')}
        ${result.rawWeight !== result.finishedWeight ? `<small class="cell-detail">وزن مواد ${measurement(result.rawWeight,'گرم')}</small>` : ''}</td>
      <td class="sort-number" data-label="بهای کل">${measurement(result.totalCost,'تومان')}</td>
      <td data-label="واحدها"><ul class="piece-list">${result.allocation.groups.map(group =>
        `<li>${measurement(group.grams,'گرم')} · ${format(group.quantity)} عدد · ${measurement(group.unitCost,'تومان')} / عدد</li>`).join('')}</ul></td>
      <td><div class="row-actions">
        <a class="icon-btn" href="${navLink('batch',batch.id)}" title="ویرایش تولید" aria-label="ویرایش تولید ${escapeHtml(batch.number)}">${icon('pen')}</a>
        <a class="icon-btn" href="${navLink('products',reportId(batch))}" title="مشاهده محصول" aria-label="مشاهده محصول ${escapeHtml(batch.number)}">${icon('report')}</a>
      </div></td></tr>`).join('');
    return `<div class="table-scroll" tabindex="0" role="region" aria-label="جدول نوبت‌های تولید"><table role="table" class="record-table catalog-table batch-table">
      <thead><tr><th scope="col">شماره تولید</th><th scope="col">تاریخ</th><th scope="col">وزن کل</th><th scope="col">بهای کل</th><th scope="col">وزن و قیمت هر واحد</th><th scope="col">عملیات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function updateList() {
    const target = document.querySelector('#record-list');
    const term = searchKey(searchText);
    const match = record => searchKey(record.name).includes(term);
    if (route.view === 'products') target.innerHTML = productGrid(latestProducts().filter(record =>
      match(record) || searchKey(record.number ?? '').includes(term) || searchKey(productCode(record)).includes(term)));
    if (route.view === 'ingredients') target.innerHTML = ingredientTable(state.ingredients.filter(match));
    if (route.view === 'prices') target.innerHTML = priceTable(state.ingredients.filter(match));
    if (route.view === 'batches') {
      const entries = visibleBatches();
      target.innerHTML = batchTable(entries);
      document.querySelector('#batch-list-exports').hidden = !entries.length;
    }
  }

  function visibleBatches() {
    const term = searchKey(searchText);
    return batchEntries(batchSort).filter(({batch}) => searchKey(batch.name).includes(term) || searchKey(batch.number).includes(term));
  }

    const {view} = route;
    const emptyOfSamples = !state.products.some(record => record.sample) && !state.ingredients.some(record => record.sample);
    const pages = {
      ingredients:['مواد اولیه','شرح ماده و ارزش غذایی هر ۱۰۰ گرم را ثبت کنید.',button('new-ingredient','افزودن ماده غذایی','plus','primary')],
      products:['محصولات','یک محصول را برای جزئیات، گزارش‌ها و بنرها انتخاب کنید.',newBatchLink()],
      prices:['قیمت مواد اولیه','قیمت هر گرم، کیلوگرم یا بسته و تاریخ آخرین تغییر را ببینید.'],
      batches:['نوبت‌های تولید','وزن کل، تعداد و بهای تمام‌شدهٔ هر نوبت را ببینید.',newBatchLink()],
    };
    const searchLabel = ['batches','products'].includes(view) ? 'جست‌وجو بر اساس نام یا شماره' : 'جست‌وجو بر اساس نام';
    const sorting = view === 'batches' ? `<div class="sorting"><label for="batch-sort">مرتب‌سازی</label><select id="batch-sort" name="batchSort">${[
      ['date','تاریخ تولید'],['number','شماره تولید'],['cost','بهای کل'],['unit','کمترین بهای واحد'],
    ].map(([value,label]) => selectedOption(value,label,batchSort === value)).join('')}</select></div>` : '';
    main.innerHTML = `${pageHead(...pages[view])}
      <div class="toolbar"><div class="search-wrap">${icon('search')}<input type="search" name="search" aria-label="${searchLabel}" placeholder="${searchLabel}…" value="${escapeHtml(searchText)}"></div>
      ${sorting}${!emptyOfSamples && ['ingredients','products'].includes(view) ? button('clear-samples','پاک‌کردن داده‌های نمونه',null,'text') : ''}</div>
      ${view === 'batches' ? `<div class="button-row list-export" id="batch-list-exports" aria-label="خروجی فهرست تولیدها" hidden>
        ${button('list-png','عکس فهرست','photo')}${button('list-pdf','PDF فهرست','pdf')}${button('list-share','ارسال فهرست','share')}</div>` : ''}
      <section class="${view === 'products' ? 'products-region' : 'panel'}" id="record-list" aria-label="${pages[view][0]}"></section>`;
    updateList();
  }

  function inputField(id, label, value = '', options = {}) {
    const {name = id, placeholder = '', numeric = false, integer = false, max = 100, more = '', className = ''} = options;
    return `<div class="${className}"><label for="${id}">${label}</label><input id="${id}" name="${name}" value="${escapeHtml(value)}" placeholder="${placeholder}" maxlength="${numeric ? 36 : max}" ${numeric ? `class="numeric-input" dir="ltr" data-numeric inputmode="${integer ? 'numeric' : 'decimal'}" autocomplete="off" spellcheck="false"` : ''} ${more}></div>`;
  }

  function nutritionFields(nutrition) {
    return `<div class="field-grid three">${NUTRIENTS.map(({key,name,unit}) => inputField(`nutrient-${key}`,`${name} (${unit})`,nullableInput(nutrition?.[key]),{name:key,placeholder:'—',numeric:true,max:16})).join('')}</div>`;
  }

  function showDialog(title, content, compact = false) {
    modal.className = compact ? 'dialog-small' : '';
    modal.innerHTML = `<header class="dialog-head"><h2 id="dialog-title">${title}</h2>${iconButton('close-dialog','بستن پنجره','close')}</header><p class="dialog-feedback" role="status"></p>${content}`;
    if (!modal.open) modal.showModal();
  }

  function formMessage(form, text = '') {
    const node = form.querySelector('.form-error');
    if (!node) return;
    node.textContent = text;
    node.hidden = text === '';
  }

  class FormIssue extends Error {
    constructor(message,field) {
      super(message);
      this.field = field;
    }
  }

  function clearFieldError(input) {
    if (!input.hasAttribute('aria-invalid')) return;
    input.removeAttribute('aria-invalid');
    const errorId = `${input.id}-error`;
    document.getElementById(errorId)?.remove();
    const hints = (input.getAttribute('aria-describedby') || '').split(' ').filter(id => id && id !== errorId);
    if (hints.length) input.setAttribute('aria-describedby',hints.join(' '));
    else input.removeAttribute('aria-describedby');
  }

  function fieldError(input, message) {
    const hint = document.createElement('small');
    hint.id = `${input.id}-error`;
    hint.className = 'field-error';
    hint.setAttribute('role','alert');
    hint.textContent = message;
    input.insertAdjacentElement('afterend',hint);
    input.setAttribute('aria-invalid','true');
    input.setAttribute('aria-describedby',[input.getAttribute('aria-describedby'),hint.id].filter(Boolean).join(' '));
    input.focus();
    throw new FormIssue(message,input);
  }

  function requiredText(input, message) {
    const value = input.value.trim();
    if (!value) fieldError(input, message);
    return value;
  }

  function readNumber(input, label, options = {}) {
    const {optional = false, min = 0, max = 1000000000} = options;
    if (optional && !input.value.trim()) return null;
    const number = parseNumber(input.value);
    if (number == null || number < min || number > max) {
      fieldError(input, `${label} را با عددی بین ${format(min)} و ${format(max)} وارد کنید.`);
    }
    return number;
  }

  function readNutrition(form) {
    return Object.fromEntries(NUTRIENTS.map(({key,name}) => [key,readNumber(form.elements[key], name, {optional:true,max:100000})]));
  }

  function openIngredient(id = '') {
    const food = state.ingredients.find(record => record.id === id);
    showDialog(food ? 'ویرایش ماده اولیه' : 'افزودن ماده غذایی', `<form id="ingredient-form" novalidate data-id="${escapeHtml(id)}">
      <div class="dialog-body">
        <p role="alert" class="form-error" hidden></p>
        ${inputField('food-name','شرح ماده غذایی',food?.name,{name:'name',placeholder:'مثلاً فندق برشته',max:80,more:'required autofocus'})}
        <h3 class="nutrition-legend">ارزش غذایی در هر ۱۰۰ گرم</h3>
        <p class="field-hint">شاخص‌های نامشخص را خالی بگذارید. اگر مقدار شاخص صفر است، ۰ وارد کنید.</p>
        ${nutritionFields(food?.nutrition)}
        ${!food ? '<p class="field-hint">پس از ثبت ماده، قیمت آن در بخش «قیمت‌ها» قابل ثبت است.</p>' : ''}
      </div>
      <footer class="dialog-actions">${button('close-dialog','انصراف',null)}<button type="submit" class="btn primary">${icon('check')} ذخیره ماده غذایی</button></footer>
      </form>`);
  }

  async function saveIngredient(form) {
    const name = requiredText(form.elements.name,'شرح ماده غذایی را وارد کنید.');
    const nutrition = readNutrition(form);
    const id = form.dataset.id || newId();
    const old = state.ingredients.find(item => item.id === id);
    const record = {id,name,pricing:old?.pricing ?? null,nutrition,sample:false};
    const ingredients = old ? state.ingredients.map(item => item.id === id ? record : item) : [...state.ingredients,record];
    if (await commit({ingredients})) {
      modal.close();
      if (route.view === 'ingredients') renderCollection();
      if (draft) renderIngredientRows();
      toast('ماده غذایی ذخیره شد.');
    }
  }

  function openPrice(id,targetRow = '') {
    const food = state.ingredients.find(record => record.id === id);
    if (!food) return;
    const pricing = food.pricing;
    showDialog('ثبت قیمت مادهٔ غذایی',`<form id="price-form" data-id="${food.id}" data-target-row="${escapeHtml(targetRow)}" novalidate>
      <div class="dialog-body">
        <p class="form-error" role="alert" hidden></p><h3>${escapeHtml(food.name)}</h3>
        <div class="field-grid">
          <div><label for="price-unit">واحد قیمت</label><select id="price-unit" name="unit">${Object.entries(PRICE_UNITS).map(([value,label]) => selectedOption(value,label,(pricing?.unit ?? 'kg') === value)).join('')}</select></div>
          ${inputField('unit-price','قیمت واحد (تومان)',nullableInput(pricing?.amount),{name:'amount',numeric:true,placeholder:'مثلاً ۴۸۰٬۰۰۰',more:'autofocus'})}
          ${inputField('pack-grams','وزن خالص بسته (گرم)',nullableInput(pricing?.packGrams),{name:'packGrams',numeric:true,placeholder:'مثلاً ۲۵۰',className:'wide pack-weight'})}
        </div><p class="field-hint" id="price-equivalent"></p>
      </div>
      <footer class="dialog-actions">${button('close-dialog','انصراف',null)}<button type="submit" class="btn primary">${icon('check')} ذخیره قیمت</button></footer>
    </form>`,true);
    updatePricePreview(modal.querySelector('#price-form'));
  }

  function updatePricePreview(form) {
    const unit = form.elements.unit.value;
    form.querySelector('.pack-weight').hidden = unit !== 'pack';
    const amount = parseNumber(form.elements.amount.value);
    const packGrams = parseNumber(form.elements.packGrams.value);
    form.querySelector('#price-equivalent').textContent = amount != null && (unit !== 'pack' || packGrams > 0)
      ? `معادل ${measurement(pricePerKilo({amount,unit,packGrams}),'تومان')} برای هر کیلوگرم` : '';
  }

  async function savePrice(form) {
    const food = state.ingredients.find(record => record.id === form.dataset.id);
    if (!food) throw new FormIssue('مادهٔ غذایی در فهرست پیدا نشد.');
    const unit = form.elements.unit.value;
    if (!Object.hasOwn(PRICE_UNITS,unit)) throw new FormIssue('واحد قیمت را انتخاب کنید.');
    const amount = readNumber(form.elements.amount,'قیمت واحد',{max:MAX_KILO_PRICE});
    const packGrams = unit === 'pack'
      ? readNumber(form.elements.packGrams,'وزن خالص بسته',{min:.001,max:MAX_GRAMS}) : null;
    const pricing = {amount,unit,packGrams,updatedAt:Date.now()};
    if (pricePerKilo(pricing) > MAX_KILO_PRICE) fieldError(form.elements.amount,'معادل قیمت هر کیلو بیش از محدودهٔ قابل ثبت است.');
    const ingredients = state.ingredients.map(item => item.id === food.id ? {...item,pricing,sample:false} : item);
    if (await commit({ingredients})) {
      modal.close();
      if (route.view === 'prices') renderCollection();
      if (draft) {
        const key = form.dataset.targetRow;
        const row = draft.rows.find(item => item.key === key && item.source === food.id);
        if (row) {
          setDraftSource(row,food.id);
          renderIngredientRows(key,'grams');
        }
      }
      toast('قیمت ذخیره شد.');
    }
  }

  function nextBatchNumber(batches) {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const digits = '0123456789';
    const alphabet = letters + digits;
    const taken = new Set(batches.map(batch => searchKey(batch.number)));
    let number;
    do {
      const random = crypto.getRandomValues(new Uint32Array(8));
      number = letters[random[0] % letters.length] + digits[random[1] % digits.length]
        + Array.from(random.slice(2),value => alphabet[value % alphabet.length]).join('');
    } while (taken.has(searchKey(number)));
    return number;
  }

  function createDraft(product,isBatch = false,copy = false) {
    const fromLegacy = isBatch && product?.quantity == null && Boolean(product?.molds);
    const quantity = fromLegacy ? computeRecipe(product).allocation.units : product?.quantity;
    return {
      isBatch,fromLegacy,
      id:copy ? '' : product?.id ?? '',

  function openCalendar() {

  function renderCalendar(focusControl = '') {
    const {year,month,cursor} = calendar;
    const {first,last,offset} = calendarMonth(year,month);
    const min = utcDay(FIRST_DATE);
    const max = utcDay(LAST_DATE);
    const selected = utcDay(draft.date);
    const today = utcDay(todayTehran());
    const {year:minYear,month:minMonth} = persianDate(min);
    const {year:maxYear,month:maxMonth} = persianDate(max);
    const yearStart = Math.max(minYear,year - 10);
    const yearEnd = Math.min(maxYear,year + 10);
    const years = Array.from({length:yearEnd - yearStart + 1},(_,i) => {
      const option = yearStart + i;
      return selectedOption(option,format(option).replaceAll('٬',''),option === year);
    }).join('');
    const months = persianMonths.map((label,i) => {
      const option = i + 1;
      if ((year === minYear && option < minMonth) || (year === maxYear && option > maxMonth)) return '';
      return selectedOption(option,label,option === month);
    }).join('');
    const days = Array.from({length:last - first + 1},(_,i) => {
      const day = first + i;
      if (day < min || day > max) return '<span aria-hidden="true"></span>';
      const date = isoDay(day);
      const isToday = day === today;
      return `<button type="button" class="calendar-day" data-action="calendar-day" data-id="${date}"
        tabindex="${day === cursor ? '0' : '-1'}" aria-label="${displayDay(date)}" aria-pressed="${day === selected}"${isToday ? ' aria-current="date"' : ''}>${format(i + 1)}</button>`;
    }).join('');
    const step = (direction,label,glyph,enabled) => `<button id="calendar-${direction}" type="button" class="icon-btn"
      data-action="calendar-step" data-id="${direction}" aria-label="${label}" ${enabled ? '' : 'disabled'}>${icon(glyph)}</button>`;
    showDialog('انتخاب تاریخ تولید',`<div class="dialog-body calendar-body">
      <div class="calendar-heading">
        ${step('previous','ماه قبل','right',first > min)}
        <label class="sr-only" for="calendar-month">ماه</label><select id="calendar-month">${months}</select>
        <label class="sr-only" for="calendar-year">سال</label><select id="calendar-year">${years}</select>
        ${step('next','ماه بعد','left',last < max)}
      </div>
      <div class="calendar-days" role="group" aria-label="روزهای ${persianMonths[month - 1]}">
        ${calendarWeekdays.map(([letter,label]) => `<span class="calendar-weekday" title="${label}">${letter}</span>`).join('')}
        ${'<span aria-hidden="true"></span>'.repeat(offset)}${days}
      </div>
    </div><footer class="dialog-actions">${button('close-dialog','انصراف',null)}${button('calendar-today','امروز','calendar','soft')}</footer>`,true);
    const control = focusControl && document.getElementById(focusControl);
    (control && !control.disabled ? control : modal.querySelector('.calendar-day[tabindex="0"]'))?.focus({preventScroll:true});
  }

  function showCalendarMonth(year,month,focusControl = '') {
    const min = utcDay(FIRST_DATE);
    const max = utcDay(LAST_DATE);
    const {first,last} = calendarMonth(year,month);
    const cursor = Math.max(min,Math.min(last,max,first + persianDate(calendar.cursor).day - 1));
    if (first > max || last < min) return;
    calendar = {year,month,cursor};
    renderCalendar(focusControl);
  }

  function selectCalendarDay(date) {
    if (!draft?.isBatch || !validDay(date)) return;
    draft.dirty ||= draft.date !== date;
    draft.date = date;
    const control = document.querySelector('#batch-date');
    clearFieldError(control);
    document.querySelector('#batch-date-value').textContent = displayDay(date);
    modal.close();
    control.focus({preventScroll:true});
  }

  modal.addEventListener('keydown',event => {
    if (!calendar || !event.target.classList.contains('calendar-day')) return;
    const moves = {ArrowRight:-1,ArrowLeft:1,ArrowUp:-7,ArrowDown:7};
    const {cursor,year,month} = calendar;
    if (event.key === 'PageUp' || event.key === 'PageDown') {
      event.preventDefault();
      const next = shiftPersianMonth(year,month,(event.key === 'PageUp' ? -1 : 1) * (event.shiftKey ? 12 : 1));
      showCalendarMonth(next.year,next.month);
      return;
    }
    const weekday = (new Date(cursor * DAY_MS).getUTCDay() + 1) % 7;
    const move = event.key === 'Home' ? -weekday : event.key === 'End' ? 6 - weekday : moves[event.key];
    if (!Number.isInteger(move)) return;
    event.preventDefault();
    const next = cursor + move;
    if (next < utcDay(FIRST_DATE) || next > utcDay(LAST_DATE)) return;
    const date = persianDate(next);
    calendar = {year:date.year,month:date.month,cursor:next};
    renderCalendar();
  });

        ${selectedFood && !selectedFood.pricing && !row.price ? `<div class="row-extra"><button type="button" class="btn text" data-action="price-for-row" data-id="${key}">${icon('money')} ثبت قیمت این ماده</button></div>` : ''}
        </div>`;
    }).join('');
    container.innerHTML = options || '<p class="initial-row">یک ماده از فهرست انتخاب کنید یا مشخصاتش را دستی وارد کنید.</p>';

  function updateDraftSummary() {
    const summary = document.querySelector('#draft-summary');
    if (!draft || !summary) return;
    const rows = [];
    let hasUnpriced = false;
    for (const row of draft.rows) {
      const grams = parseNumber(row.grams);
      const price = parseNumber(row.price);
      const output = document.getElementById(`row-total-${row.key}`);
      const cost = row.source && grams && price != null ? grams * price / 1000 : null;
      if (output) output.textContent = format(cost);
      if (row.source && grams > 0) {
        rows.push({...row,grams,price:price ?? 0});
        if (price == null) hasUnpriced = true;
      }
    }
    const result = computeRecipe({
      rows,serving:parseNumber(draft.serving),extraCost:parseNumber(draft.extraCost) ?? 0,
      quantity:parseNumber(draft.quantity),
    });
    const unit = result.allocation?.groups[0];
    const money = value => measurement(hasUnpriced || !rows.length ? null : value,'تومان');
    summary.innerHTML = `<div><dt>وزن کل مواد</dt><dd>${measurement(rows.length ? result.rawWeight : null,'گرم')}</dd></div>
      ${draft.isBatch ? `<div><dt>وزن هر واحد</dt><dd>${measurement(unit?.grams,'گرم')}</dd></div>
        <div><dt>بهای هر واحد</dt><dd>${money(unit?.unitCost)}</dd></div>` : `<div><dt>بهای هر کیلو</dt><dd>${money(result.costPerKg)}</dd></div>`}
      <div class="summary-total"><dt>بهای کل</dt><dd>${money(result.totalCost)}</dd></div>`;
    document.querySelector('#draft-price-hint').hidden = !hasUnpriced;
  }

  async function saveProduct(form) {
    const {isBatch} = draft;
    let details = {};
    if (isBatch) {
      const {number,date} = draft;
      const key = searchKey(number);
      if (!key || state.batches.some(batch => batch.id !== draft.id && searchKey(batch.number) === key)) {
        throw new FormIssue('شمارهٔ تولید تکراری است. فرم تولید جدید را دوباره باز کنید.');
      }
      if (!validDay(date)) fieldError(form.querySelector('#batch-date'),'تاریخ تولید را انتخاب کنید.');
      const input = form.elements.quantity;
      const quantity = readNumber(input,'تعداد محصول',{min:1,max:Number.MAX_SAFE_INTEGER});
      if (!Number.isSafeInteger(quantity)) fieldError(input,'تعداد محصول را با عدد صحیح وارد کنید.');
      details = {number,date,quantity};
    }
    const name = isBatch ? form.elements.name.value.trim() || `تولید ${details.number}`
      : requiredText(form.elements.name,'نام محصول را وارد کنید.');
    const description = form.elements.description.value.trim();
    const serving = readNumber(form.elements.serving,'وزن هر وعده',{optional:true,min:.001,max:MAX_GRAMS});
    const extraCost = readNumber(form.elements.extraCost,'هزینه‌های جانبی',{optional:true}) ?? 0;
    if (!draft.rows.length) throw new FormIssue('دست‌کم یک ماده غذایی به دستور اضافه کنید.');
    if (draft.loadingPhoto) throw new FormIssue('چند لحظه صبر کنید تا عکس آماده شود.');
    const rows = draft.rows.map(row => {
      if (!row.source) fieldError(document.getElementById(`row-source-${row.key}`),'ماده هر ردیف را انتخاب کنید یا «ورود دستی» را بزنید.');
      const label = row.source === 'custom' ? requiredText(document.getElementById(`row-name-${row.key}`),'شرح ماده غذایی دستی را وارد کنید.') : row.name;
      const grams = readNumber(document.getElementById(`row-grams-${row.key}`),'وزن ماده غذایی',{min:.001,max:MAX_GRAMS});
      const priceInput = document.getElementById(`row-price-${row.key}`);
      if (row.source !== 'custom' && !priceInput.value) fieldError(priceInput,`قیمت «${row.name}» را در بخش قیمت‌ها ثبت کنید.`);
      const price = readNumber(priceInput,'قیمت هر کیلو',{max:MAX_KILO_PRICE});
      return {ingredientId:row.source === 'custom' ? null : row.source,name:label,grams,price,priceAt:row.priceAt,nutrition:{...row.nutrition}};
    });
    const id = draft.id || newId();
    const product = {id,name,description,rows,finishedWeight:null,serving,extraCost,bannerWeight:draft.bannerWeight,photo:draft.photo,updatedAt:Date.now(),sample:false,...details};
    const collection = isBatch ? 'batches' : 'products';
    const records = draft.id ? state[collection].map(record => record.id === id ? product : record) : [...state[collection],product];
    const pendingDraft = draft;
    if (await commit({[collection]:records})) {
      if (draft === pendingDraft) {
        draft.dirty = false;
        reportKind = 'cost';
        go('products',reportId(product),true);
      }
      toast(isBatch ? 'نوبت تولید ذخیره شد.' : 'محصول ذخیره شد.');
    }
  }

  function loadImage(source) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('Image could not be decoded'));
      image.src = source;
    });
  }

  function jpegSize(bytes) {
    if (bytes[0] !== 0xff || bytes[1] !== 0xd8) return null;
    for (let cursor = 2; cursor + 3 < bytes.length;) {
      if (bytes[cursor++] !== 0xff) return null;
      while (bytes[cursor] === 0xff) cursor += 1;
      const marker = bytes[cursor++];
      if (marker === 0xd9 || marker === 0xda) return null;
      const length = bytes[cursor] * 256 + bytes[cursor + 1];
      if (length < 2 || cursor + length > bytes.length) return null;
      const frame = marker >= 0xc0 && marker <= 0xcf && ![0xc4,0xc8,0xcc].includes(marker);
      if (frame && length >= 8) {
        return {width:bytes[cursor+5]*256+bytes[cursor+6],height:bytes[cursor+3]*256+bytes[cursor+4]};
      }
      cursor += length;
    }
    return null;
  }

  function rasterInfo(buffer) {
    const bytes = new Uint8Array(buffer);
    if (bytes.length < 16) return null;
    const view = new DataView(buffer);
    const tag = (offset,length) => String.fromCharCode(...bytes.subarray(offset,offset+length));
    if (bytes[0] === 0xff && bytes[1] === 0xd8) {
      const size = jpegSize(bytes);
      return size && {type:'image/jpeg',...size};
    }
    if (bytes.length >= 24 && tag(0,8) === '\x89PNG\r\n\x1a\n' && tag(12,4) === 'IHDR') {
      return {type:'image/png',width:view.getUint32(16),height:view.getUint32(20)};
    }
    if (tag(0,6) === 'GIF87a' || tag(0,6) === 'GIF89a') {
      return {type:'image/gif',width:view.getUint16(6,true),height:view.getUint16(8,true)};
    }
    if (bytes.length >= 30 && tag(0,4) === 'RIFF' && tag(8,4) === 'WEBP') {
      if (tag(12,4) === 'VP8X') {
        const uint24 = i => bytes[i] + bytes[i+1]*256 + bytes[i+2]*65536;
        return {type:'image/webp',width:uint24(24)+1,height:uint24(27)+1};
      }
      if (tag(12,4) === 'VP8L' && bytes[20] === 0x2f) {
        const bits = view.getUint32(21,true);
        return {type:'image/webp',width:(bits&0x3fff)+1,height:((bits>>>14)&0x3fff)+1};
      }
      if (tag(12,4) === 'VP8 ' && tag(23,3) === '\x9d\x01\x2a') {
        return {type:'image/webp',width:view.getUint16(26,true)&0x3fff,height:view.getUint16(28,true)&0x3fff};
      }
    }
    if (tag(4,4) === 'ftyp') {
      const brand = tag(8,4);
      if (['avif','avis'].includes(brand)) return {type:'image/avif'};
      if (['heic','heix','hevc','hevx','mif1','msf1'].includes(brand)) return {type:'image/heic'};
    }
    return null;
  }

  function allowedImageSize(width,height) {
    return width > 0 && height > 0 && width <= 12000 && height <= 12000 && width*height <= 64000000;
  }

  async function attachPhoto(file) {
    if (!file || !draft || draft.loadingPhoto) return;
    if (file.size > MAX_PHOTO_BYTES) {
      toast('عکسی کوچک‌تر از ۳۰ مگابایت انتخاب کنید.',true);
      return;
    }
    const target = draft;
    target.loadingPhoto = true;
    renderPhotoSlot();
    let url;
    try {
      const info = rasterInfo(await file.arrayBuffer());
      if (!info) throw new Error('Unsupported image');
      if (info.width !== undefined && !allowedImageSize(info.width,info.height)) throw new Error('Image dimensions');
      url = URL.createObjectURL(file.slice(0,file.size,info.type));
      const image = await loadImage(url);
      if (!allowedImageSize(image.naturalWidth,image.naturalHeight)) throw new Error('Image dimensions');
      const canvas = document.createElement('canvas');
      const ratio = Math.min(1, PHOTO_EDGE / Math.max(image.naturalWidth,image.naturalHeight));
      canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
      const context = canvas.getContext('2d', {alpha:false});
      context.fillStyle = '#fff';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(image,0,0,canvas.width,canvas.height);
      const jpeg = canvas.toDataURL('image/jpeg',.88);
      if (!photoUrl(jpeg)) throw new Error('Image encoding failed');
      target.photo = jpeg;
      target.dirty = true;
      if (draft === target) toast('عکس اضافه شد.');
    } catch {
      if (draft === target) toast('عکس قابل استفاده نبود. یک فایل JPG، PNG یا WebP با ابعاد کوچک‌تر انتخاب کنید.',true);
    } finally {
      target.loadingPhoto = false;
      if (url) URL.revokeObjectURL(url);
      if (draft === target) renderPhotoSlot();
    }
  }

  function unitReport(result,legacy) {
    const {allocation} = result;
    const rows = allocation.groups.map(group => [
      format(group.grams),format(group.quantity),format(group.unitCost),format(group.weight),format(group.cost),
    ]);
    if (allocation.leftover > 0) rows.push(['باقی‌مانده','—','—',format(allocation.leftover),format(allocation.leftoverCost)]);
    return {
      title:legacy ? 'قالب‌ها و محصولات جزء' : 'وزن و بهای هر واحد',className:'unit-report-table',
      headings:['وزن واحد (گرم)','تعداد','بهای واحد (تومان)','وزن گروه (گرم)','بهای گروه (تومان)'],
      widths:[.17,.12,.23,.20,.28],rows,
      total:['جمع تولید',format(allocation.units),'—',format(result.finishedWeight),format(result.totalCost)],
    };
  }

  function batchRegisterModel() {
    const entries = visibleBatches();
    if (!entries.length) return null;
    const weight = entries.reduce((sum,{result}) => sum+result.finishedWeight,0);
    const cost = entries.reduce((sum,{result}) => sum+result.totalCost,0);
    return {
      kind:'register',product:{id:'batch-register',name:''},title:'فهرست نوبت‌های تولید',
      key:`register/${batchSort}/${searchKey(searchText)}`,
      facts:[['تعداد نوبت‌ها',format(entries.length)],['مجموع وزن',measurement(weight,'گرم')],['مجموع بهای تولیدها',measurement(cost,'تومان')]],
      sections:[
        {title:'نوبت‌های تولید',headings:['شماره و نام تولید','تاریخ تولید','تعداد واحد','وزن کل (گرم)','بهای کل (تومان)'],widths:[.30,.19,.12,.17,.22],
          rows:entries.map(({batch,result}) => [`${batch.number} · ${batch.name}`,displayDay(batch.date),format(result.allocation.units),format(result.finishedWeight),format(result.totalCost)])},
        {title:'وزن و بهای هر واحد',headings:['شماره تولید','وزن واحد (گرم)','تعداد','بهای هر واحد (تومان)'],widths:[.30,.22,.16,.32],
          rows:entries.flatMap(({batch,result}) => result.allocation.groups.map(group => [batch.number,format(group.grams),format(group.quantity),format(group.unitCost)]))},
      ],

    };
  }

  function bannerTables(weight,result) {
    const factor = weight / result.finishedWeight;
    const amounts = new Map();
    for (const row of result.rows) {
      const key = searchKey(row.name);
      const amount = amounts.get(key) ?? {name:row.name,grams:0};
      amount.grams += row.grams;
      amounts.set(key,amount);
    }
    const ingredients = {
      title:'مواد به‌کاررفته',className:'weight-table',
      headings:['مادهٔ غذایی','وزن مصرف (گرم)'],widths:[.64,.36],
      rows:[...amounts.values()].map(({name,grams}) => [name,format(grams*factor)]),
    };
    const nutrition = {
      title:'ارزش غذایی',className:'weight-table',
      headings:['شاخص غذایی','مقدار'],widths:[.62,.38],
      rows:result.nutrition.map(a => [`${a.name} (${a.unit})`,format(a.batch === null ? null : a.batch*factor)]),
    };
    return {weight,ingredients,nutrition};
  }

  const englishNumbers = new Intl.NumberFormat('en-US',{maximumFractionDigits:3});

  function englishMeasure(value,unit) {
    if (value == null) return '—';
    if (value > 0 && value < .001) return `<0.001 ${unit}`;
    return `${englishNumbers.format(value)} ${unit}`;
  }

    if (kind === 'cost') {

          : `وزن کل مواد پیش از تولید ${measurement(result.rawWeight,'گرم')} است. بهای هر کیلو${batch ? ' و هر واحد' : ''} بر اساس وزن ذخیره‌شده محاسبه شده است.`,
      };

    const missing = result.nutrition.some(nutrient => nutrient.batch == null) ? ' — یعنی دادهٔ شاخص برای بخشی از مواد ثبت نشده است.' : '';
    if (kind === 'banner') {
      const weight = product.bannerWeight ?? serving ?? 100;
      const banner = bannerTables(weight,result);
      return {
        ...model,banner,
        facts:[['وزن مبنای بنر',measurement(weight,'گرم')],['وزن کل',measurement(result.finishedWeight,'گرم')]],
        note:'مواد مصرفی و ارزش غذایی برای وزن مبنای بنر محاسبه شده‌اند.' + missing,
      };
    }
    if (kind === 'label') {
      const amount = nutrient => serving ? nutrient.serving : nutrient.per100;
      const servingSize = englishMeasure(serving ?? 100,'g');
      const code = productCode(product);
      const energy = englishMeasure(amount(result.nutrition[0]),'kcal');
      const ordered = ['fat','satFat','transFat','carbs','fiber','sugar','protein','salt'];
      const rows = ordered.map(key => {
        const nutrient = result.nutrition.find(item => item.key === key);
        return [nutrient.english,englishMeasure(amount(nutrient),'g')];
      });
      return {
        ...model,label:{servingSize,code,energy,rows},
        facts:[['Serving size',servingSize],['Energy per serving',energy],['Product code',code]],
        note:missing ? 'Estimated from the recipe. A dash indicates unavailable data.' : 'Estimated from the recipe.',
      };
    }
    return {
      ...model,
      facts:[
        ['انرژی در ۱۰۰ گرم',measurement(result.nutrition[0].per100,'کیلوکالری')],
        ['وزن کل',measurement(result.finishedWeight,'گرم')],
        ['وزن هر وعده',measurement(serving,'گرم')],
      ],
      sections:[{title:'',className:'nutrition-table',
        headings:['شاخص غذایی','در ۱۰۰ گرم',serving ? `وعده ${measurement(serving,'گرمی')}` : 'هر وعده','کل تولید'],
        widths:[.36,.20,.23,.21],
        rows:result.nutrition.map(a => [`${a.name} (${a.unit})`,format(a.per100),format(a.serving),format(a.batch)]),
      }],
      note:'ارزش غذایی از مقادیر ثبت‌شده در ترکیبات برآورد شده است.' + missing +
        (serving ? '' : ' برای محاسبه هر وعده، وزن آن را در دستور ثبت کنید.'),
    };
  }

  function sheetPages(sections) {
    const newPage = () => ({segments:[],bottom:TABLE_TOP});
    const pages = [newPage()];
    for (const table of sections) {
      let offset = 0;
      while (offset < table.rows.length) {
        const page = pages.at(-1);
        const gap = page.segments.length ? 16 : 0;
        const titleSpace = table.title ? 35 : 0;
        const top = page.bottom + gap + titleSpace;
        const room = TABLE_END - top - TABLE_HEAD;
        const remaining = table.rows.length - offset;
        const last = remaining*TABLE_ROW + (table.total ? TABLE_HEAD : 0) <= room;
        const count = last ? remaining : Math.min(remaining-1,Math.floor(room/TABLE_ROW));
        if (count < 1) {
          pages.push(newPage());
          continue;
        }
        const total = last ? table.total : null;
        page.segments.push({table,top,rows:table.rows.slice(offset,offset+count),total});
        page.bottom = top + TABLE_HEAD + count*TABLE_ROW + (total ? TABLE_HEAD : 0);
        offset += count;
        if (!last) pages.push(newPage());
      }
    }
    return pages;
  }

  function bannerPages(model) {
    return Math.max(1,Math.ceil(model.banner.ingredients.rows.length / BANNER_PAGE_ROWS));

    const rows = Math.max(model.banner.nutrition.rows.length,Math.min(BANNER_PAGE_ROWS,model.banner.ingredients.rows.length));

  function rectangle(ctx,x,y,width,height,color,radius = 0) {
    ctx.fillStyle = color;
    if (!radius) { ctx.fillRect(x,y,width,height); return; }
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.arcTo(x+width,y,x+width,y+height,radius);
    ctx.arcTo(x+width,y+height,x,y+height,radius);
    ctx.arcTo(x,y+height,x,y,radius);
    ctx.arcTo(x,y,x+width,y,radius);
    ctx.closePath();
    ctx.fill();
  }

  function textStyle(ctx, size, weight, color, align, direction = 'rtl') {
    ctx.font = `${weight} ${size}px Vazirmatn, Tahoma, Arial`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.direction = direction;
  }

  function paintText(ctx,value,x,y,{size = 26, weight = 500, color = exportPalette.ink, align = 'right', limit = 920, fit = false, direction = 'rtl'} = {}) {
    textStyle(ctx,size,weight,color,align,direction);
    const text = String(value);
    if (fit || ctx.measureText(text).width <= limit) {
      ctx.fillText(text,x,y,limit);
      return;
    }
    const letters = Array.from(text);
    while (letters.length && ctx.measureText(letters.join('') + '…').width > limit) letters.pop();
    ctx.fillText(letters.join('') + '…',x,y);
  }

  function paintParagraph(ctx,text,x,y,limit,lines,style) {
    if (!text) return;
    const {size = 26,weight = 500,color = exportPalette.ink} = style;
    textStyle(ctx,size,weight,color,'right');
    const words = text.trim().split(/\s+/g);
    let line = '';
    let index = 0;
    while (words.length) {
      const word = words.shift();
      const expanded = [line,word].filter(Boolean).join(' ');
      if (ctx.measureText(expanded).width <= limit || !line) {
        line = expanded;
      } else {
        if (index === lines - 1) {
          paintText(ctx,[line,word,...words].join(' '),x,y + index * (size + 9),{...style,limit});
          return;
        }
        paintText(ctx,line,x,y + index * (size + 9),{...style,limit});
        index += 1;
        line = word;
      }
    }
    paintText(ctx,line,x,y + index * (size + 9),{...style,limit});
  }

  function paintBrand(ctx,logo,x,y,width) {
    ctx.drawImage(logo,x,y,width,width * logo.naturalHeight / logo.naturalWidth);

  function paintReportRow(ctx,cells,widths,left,top,width,height,style) {
    rectangle(ctx,left,top,width,height,style.background);

      const column = widths[index] * width;

      paintText(ctx,cell,x,top + height / 2 + 1,{
        size:style.size,weight:style.weight,color:style.color,align,limit:column - 26,fit:true,
      });
      right -= column;
    });
    rectangle(ctx,left,top + height - 1,width,1,exportPalette.line);
  }

  function code128Symbols(code) {
    const start = 104; // Code Set B
    const values = Array.from(code,char => char.charCodeAt(0) - 32);
    const check = values.reduce((sum,value,i) => sum + value * (i + 1),start) % 103;
    return [start,...values,check,106];
  }

  function paintBarcode(ctx,code,x,y,width,height) {
    const patterns = code128Symbols(code).map(value => CODE128_PATTERNS[value]);
    const quiet = 10;
    const modules = patterns.join('').split('').reduce((sum,size) => sum + Number(size),quiet * 2);
    const scale = Math.floor(width / modules);
    let offset = x + Math.floor((width - modules * scale) / 2) + quiet * scale;
    ctx.fillStyle = exportPalette.ink;
    for (const pattern of patterns) {
      for (let i = 0; i < pattern.length; i += 1) {
        const span = Number(pattern[i]) * scale;
        if (i % 2 === 0) ctx.fillRect(offset,y,span,height);
        offset += span;
      }
    }
  }
